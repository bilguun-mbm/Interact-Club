<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhaSu Interact Club</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: { 900: '#433f92' },
                        orange: { 500: '#ec8b3f' }
                    }
                }
            }
        }
    </script>

    <!-- Custom Scrollbar & Animations -->
    <style>
        body { margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-left: 2px solid #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #000; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1a1a1a; border-left: 2px solid #fff; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #fff; }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

    <!-- Firebase Compat SDKs (Stable for single-file HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- ES Module Import Map for React and Lucide Icons -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    
    <!-- Babel for In-Browser JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            ShieldAlert, Calendar, Clock, DollarSign, 
            CheckCircle, XCircle, LogOut, CheckSquare, 
            Users, Menu, ChevronLeft, Moon, Sun, Flag, Gavel, Plus, AlertTriangle, Table, User, Mail, Edit3, Image as ImageIcon, Trash2, Camera, Save, Bell, Lock, Instagram, MessageSquare, Phone, Search, UserMinus
        } from 'lucide-react';

        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCElkzEypV_0EhAewvqQtGZ9in1ER3T7M4",
            authDomain: "interact-club-727bf.firebaseapp.com",
            projectId: "interact-club-727bf",
            storageBucket: "interact-club-727bf.firebasestorage.app",
            messagingSenderId: "258037151046",
            appId: "1:258037151046:web:c58343e4af191c090a6147",
            measurementId: "G-SXWECDWW5W"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- CONSTANTS & CONFIG ---
        const ROLES = {
            PRESIDENT: 'President',
            HEAD_FINANCE: 'Head of Finance & Marketing',
            HEAD_EVENTS: 'Head of Events & Operations',
            HEAD_COMMUNITY: 'Head of Community & Partnership',
            HEAD_MEDIA: 'Head of Creative & Media',
            MEMBER: 'Member'
        };

        const SECTORS = ['Finance & Marketing', 'Events & Operations', 'Community & Partnership', 'Creative & Media', 'Global'];

        const SECTOR_COLORS = {
            'Finance & Marketing': 'border-emerald-500 bg-emerald-50 text-emerald-900 dark:bg-emerald-900/30 dark:text-emerald-300',
            'Events & Operations': 'border-rose-500 bg-rose-50 text-rose-900 dark:bg-rose-900/30 dark:text-rose-300',
            'Community & Partnership': 'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-900/30 dark:text-amber-300',
            'Creative & Media': 'border-fuchsia-500 bg-fuchsia-50 text-fuchsia-900 dark:bg-fuchsia-900/30 dark:text-fuchsia-300',
            'Global': 'border-[#433f92] bg-[#433f92]/10 text-[#433f92] dark:bg-[#433f92]/30 dark:text-indigo-300'
        };

        // --- MAIN APPLICATION COMPONENT ---
        function App() {
            // Auth & Profile State
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loadingAuth, setLoadingAuth] = useState(true);
            
            // Data State
            const [profiles, setProfiles] = useState([]);
            const [treasury, setTreasury] = useState([]);
            const [hours, setHours] = useState([]);
            const [events, setEvents] = useState([]);
            const [reports, setReports] = useState([]);
            const [eventIdeas, setEventIdeas] = useState([]);
            const [eventRecruitments, setEventRecruitments] = useState([]);
            const [news, setNews] = useState([]);
            const [reminders, setReminders] = useState([]);

            // UI State
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [showTreasuryModal, setShowTreasuryModal] = useState(false);
            const [showFeedbackModal, setShowFeedbackModal] = useState(false);
            const [viewingMemberProfile, setViewingMemberProfile] = useState(null);
            const [themeTransition, setThemeTransition] = useState(null);

            // 1. Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const doc = await db.collection('profiles').doc(u.uid).get();
                        if (doc.exists) {
                            setProfile({ id: doc.id, userId: u.uid, ...doc.data() });
                        } else {
                            // Account erased from database
                            await auth.signOut();
                            setProfile(null);
                        }
                    } else {
                        setProfile(null);
                    }
                    setLoadingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            // 2. Data Sync
            useEffect(() => {
                if (!user) return;
                
                const unsubs = [];
                const mapSnap = (snap) => snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                unsubs.push(db.collection('profiles').onSnapshot(snap => {
                    const data = mapSnap(snap);
                    setProfiles(data);
                    const myProfile = data.find(p => p.userId === user.uid);
                    if (myProfile) {
                        setProfile(myProfile);
                    }
                }));
                unsubs.push(db.collection('treasury').orderBy('timestamp', 'desc').onSnapshot(snap => setTreasury(mapSnap(snap))));
                unsubs.push(db.collection('hours').orderBy('timestamp', 'desc').onSnapshot(snap => setHours(mapSnap(snap))));
                unsubs.push(db.collection('events').orderBy('timestamp', 'desc').onSnapshot(snap => setEvents(mapSnap(snap))));
                unsubs.push(db.collection('reports').orderBy('timestamp', 'desc').onSnapshot(snap => setReports(mapSnap(snap))));
                unsubs.push(db.collection('eventIdeas').orderBy('timestamp', 'desc').onSnapshot(snap => setEventIdeas(mapSnap(snap))));
                unsubs.push(db.collection('eventRecruitments').orderBy('timestamp', 'desc').onSnapshot(snap => setEventRecruitments(mapSnap(snap))));
                unsubs.push(db.collection('news').orderBy('timestamp', 'desc').onSnapshot(snap => setNews(mapSnap(snap))));
                unsubs.push(db.collection('reminders').where('userId', '==', user.uid).onSnapshot(snap => setReminders(mapSnap(snap))));

                return () => unsubs.forEach(unsub => unsub());
            }, [user]);

            const handleLogout = async () => {
                await auth.signOut();
            };

            // --- PERMISSIONS ---
            const isPresident = profile?.role === ROLES.PRESIDENT;
            const isHead = profile?.role?.startsWith('Head');
            const isFinance = profile?.role === ROLES.HEAD_FINANCE;
            const canModifyTreasury = isPresident || isFinance;

            // --- GLOBAL MEMBER ERASE ACTION (PRESIDENT ONLY) ---
            const handleEraseMember = async (targetProfile) => {
                if (!isPresident) return;
                if (targetProfile.role === ROLES.PRESIDENT) {
                    alert("Presidents cannot be erased.");
                    return;
                }
                const confirmMsg = `Are you sure you want to completely erase ${targetProfile.name}${targetProfile.nickname ? ` (${targetProfile.nickname})` : ''}?

This will permanently remove them from the Member Lobby, the Admin Spreadsheet, and all Event Rosters.`;
                if (!window.confirm(confirmMsg)) return;

                const uid = targetProfile.userId || targetProfile.id;
                try {
                    // 1. Delete Firestore profile document completely
                    await db.collection('profiles').doc(uid).delete();

                    // 2. Remove their ID from all event applications
                    const recs = (eventRecruitments || []).filter(r => r.applicants && r.applicants.includes(uid));
                    for (const r of recs) {
                        const updatedApplicants = r.applicants.filter(id => id !== uid);
                        await db.collection('eventRecruitments').doc(r.id).update({ applicants: updatedApplicants });
                    }

                    // 3. Close modal if currently viewing this user
                    if (viewingMemberProfile && (viewingMemberProfile.userId === uid || viewingMemberProfile.id === uid)) {
                        setViewingMemberProfile(null);
                    }

                    alert(`${targetProfile.name} has been completely erased from all club lists.`);
                } catch (err) {
                    alert("Error removing member: " + err.message);
                }
            };

            // --- RADIAL THEME TOGGLE ---
            const handleToggleTheme = (e) => {
                const x = e.clientX;
                const y = e.clientY;
                const isGoingDark = !darkMode;
                setThemeTransition({ x, y, toDark: isGoingDark, progress: false });
                
                setTimeout(() => setThemeTransition(prev => ({ ...prev, progress: true })), 50);
                setTimeout(() => {
                    setDarkMode(isGoingDark);
                    if (isGoingDark) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                }, 400);
                setTimeout(() => setThemeTransition(null), 850);
            };

            // --- IDENTITY GATE ---
            if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-[#F4F4F0] dark:bg-[#111] font-black uppercase tracking-widest text-[#433f92]">Connecting to Portal...</div>;
            
            if (!user || !profile) {
                return <IdentityGate profiles={profiles} />;
            }

            if (profile.status === 'Removed' || profile.status === 'Banned') return <BannedScreen />;

            const currentBalance = treasury.reduce((acc, curr) => acc + Number(curr.amount), 0);

            // --- NAVIGATION CONFIG ---
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', Icon: CheckSquare },
                { id: 'members', label: 'Members', Icon: Users },
                { id: 'events', label: 'Events & Roles', Icon: Calendar },
                ...(!isPresident ? [{ id: 'hours', label: 'Time Tracking', Icon: Clock }] : []),
                { id: 'reminders', label: 'My Reminders', Icon: Bell },
                ...(!isPresident ? [{ id: 'reports', label: 'Report Center', Icon: Flag }] : []),
                ...((isPresident || isHead) ? [{ id: 'admin', label: 'Administration', Icon: ShieldAlert }] : [])
            ];

            const activeIndex = navItems.findIndex(item => item.id === activeTab);

            return (
                <div className="font-sans relative">
                    
                    {/* Radial Theme Transition Overlay */}
                    {themeTransition && (
                        <div 
                            className="fixed z-[9999] pointer-events-none"
                            style={{
                                left: themeTransition.x, top: themeTransition.y,
                                width: '1px', height: '1px', borderRadius: '50%',
                                boxShadow: `0 0 0 ${themeTransition.progress ? '150vmax' : '0'} ${themeTransition.toDark ? '#111827' : '#f9fafb'}`,
                                transition: 'box-shadow 0.8s ease-in-out'
                            }}
                        />
                    )}

                    <div className="flex h-screen overflow-hidden bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200 relative">
                        
                        <BackgroundFX darkMode={darkMode} />

                        {/* --- SIDEBAR --- */}
                        <nav className={`bg-white dark:bg-gray-800 border-r-2 border-gray-900 dark:border-gray-200 flex flex-col transition-all duration-300 z-20 shadow-[4px_0_0_0_rgba(0,0,0,0.1)] ${sidebarOpen ? 'w-64' : 'w-20'}`}>
                            <div className="p-4 flex items-center justify-between border-b-2 border-gray-900 dark:border-gray-200 h-16 bg-[#433f92] text-white">
                                {sidebarOpen && <span className="font-black text-xl tracking-tighter truncate">KHASU INTERACT</span>}
                                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-white/20 text-[#ec8b3f] transition-colors">
                                    {sidebarOpen ? <ChevronLeft size={20} /> : <Menu size={20} />}
                                </button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto py-4 relative px-2 custom-scrollbar">
                                <div 
                                    className="absolute left-2 right-2 h-12 bg-[#433f92]/10 dark:bg-[#433f92]/30 border-l-4 border-[#ec8b3f] transition-all duration-300 ease-out z-0"
                                    style={{ top: `calc(${activeIndex >= 0 ? activeIndex : -1} * 3rem + 1rem)`, opacity: activeIndex >= 0 ? 1 : 0 }}
                                />
                                
                                <div className="relative z-10 space-y-0">
                                    {navItems.map((item) => (
                                        <button 
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`flex items-center w-full h-12 px-3 transition-colors font-bold text-sm
                                            ${activeTab === item.id ? 'text-[#433f92] dark:text-indigo-300' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'}
                                            ${!sidebarOpen ? 'justify-center' : 'gap-3'}`}
                                            title={!sidebarOpen ? item.label : undefined}
                                        >
                                            <span className={activeTab === item.id ? 'text-[#ec8b3f]' : ''}><item.Icon size={20} /></span>
                                            {sidebarOpen && <span className="truncate">{item.label}</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="px-3 py-3 border-t-2 border-gray-900 dark:border-gray-200 flex flex-col gap-2">
                                <a href="https://www.instagram.com/orkhonkhasu_interactclub_?utm_source=ig_web_button_share_sheet&mdxt=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer" className={`p-2 border-2 border-black bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 text-white uppercase text-xs font-black flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-[2px_2px_0px_0px_#000] ${!sidebarOpen ? 'px-0' : ''}`} title="Instagram">
                                    <Instagram size={16} /> {sidebarOpen && <span>Instagram</span>}
                                </a>
                                <button onClick={() => setShowFeedbackModal(true)} className={`p-2 border-2 border-black bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white uppercase text-xs font-black flex items-center justify-center gap-2 hover:bg-black hover:text-white transition-colors shadow-[2px_2px_0px_0px_#000] ${!sidebarOpen ? 'px-0' : ''}`} title="Feedback to Devs">
                                    <MessageSquare size={16} /> {sidebarOpen && <span>Dev Feedback</span>}
                                </button>
                            </div>

                            <div 
                                onClick={() => setActiveTab('profile')}
                                className={`p-4 border-t-2 border-gray-900 dark:border-gray-200 cursor-pointer transition-colors ${SECTOR_COLORS[profile.sector] || 'bg-gray-100 dark:bg-gray-800'} ${activeTab === 'profile' ? 'border-l-4 border-l-[#ec8b3f] brightness-95' : 'hover:brightness-95'}`}
                                title="My Profile"
                            >
                                <div className={`flex items-center ${sidebarOpen ? 'gap-3' : 'justify-center'} `}>
                                    <div className="w-10 h-10 rounded-none bg-black border-2 border-white text-white flex items-center justify-center font-bold overflow-hidden shrink-0">
                                        {profile.avatar ? <img src={profile.avatar} alt="avatar" className="w-full h-full object-cover"/> : (profile.nickname ? profile.nickname.charAt(0).toUpperCase() : profile.name.charAt(0).toUpperCase())}
                                    </div>
                                    {sidebarOpen && (
                                        <div className="overflow-hidden">
                                            <p className="font-bold text-sm truncate">{profile.nickname || profile.name}</p>
                                            <p className="text-[10px] font-black truncate uppercase opacity-80">{profile.role}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </nav>

                        {/* --- MAIN CONTENT AREA --- */}
                        <div className="flex-1 flex flex-col min-w-0 z-10 relative bg-transparent">
                            
                            {/* Topbar */}
                            <header className="h-16 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b-2 border-gray-900 dark:border-gray-200 flex items-center justify-between px-6 shadow-sm">
                                <div 
                                    onClick={() => canModifyTreasury ? setShowTreasuryModal(true) : null}
                                    className={`flex items-center gap-2 px-4 py-1.5 border-2 border-gray-900 dark:border-gray-200 bg-white dark:bg-gray-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,0.1)] ${canModifyTreasury ? 'cursor-pointer hover:border-[#ec8b3f] hover:translate-y-[-1px] transition-transform' : ''}`}
                                >
                                    <DollarSign size={16} className="text-[#ec8b3f]" />
                                    <span className="font-mono font-black text-sm text-[#433f92] dark:text-[#a09df0]">₮{currentBalance.toLocaleString()}</span>
                                </div>

                                <button onClick={handleToggleTheme} className="p-2 border-2 border-gray-900 dark:border-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-[#433f92] dark:text-[#ec8b3f] transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,0.1)]">
                                    {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                                </button>
                            </header>

                            {/* Content Body */}
                            <main className="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar relative">
                                {activeTab === 'dashboard' && <DashboardView treasury={currentBalance} hours={hours} profiles={profiles} profile={profile} events={events} eventRecruitments={eventRecruitments} news={news} reminders={reminders} isPresident={isPresident} isHead={isHead} onOpenMemberProfile={setViewingMemberProfile} />}
                                {activeTab === 'members' && <MembersDirectoryView profiles={profiles} hours={hours} isPresident={isPresident} onOpenMemberProfile={setViewingMemberProfile} onEraseMember={handleEraseMember} />}
                                {activeTab === 'profile' && <ProfileView profile={profile} onLogout={handleLogout} />}
                                {activeTab === 'reminders' && <RemindersView reminders={reminders} profile={profile} />}
                                {activeTab === 'events' && <EventsView events={events} eventIdeas={eventIdeas} profile={profile} isPresident={isPresident} isHead={isHead} eventRecruitments={eventRecruitments} profiles={profiles} onOpenMemberProfile={setViewingMemberProfile} />}
                                {activeTab === 'hours' && !isPresident && <HoursView hours={hours} profile={profile} profiles={profiles} />}
                                {activeTab === 'reports' && !isPresident && <ReportsView reports={reports} profile={profile} profiles={profiles} />}
                                {activeTab === 'admin' && (isPresident || isHead) && <AdminView profiles={profiles} isPresident={isPresident} reports={reports} currentUser={profile} eventRecruitments={eventRecruitments} onOpenMemberProfile={setViewingMemberProfile} onEraseMember={handleEraseMember} />}
                            </main>

                        </div>
                    </div>

                    {/* Modals */}
                    {showTreasuryModal && canModifyTreasury && (
                        <TreasuryModal onClose={() => setShowTreasuryModal(false)} profile={profile} balance={currentBalance} treasuryRecords={treasury} />
                    )}
                    {showFeedbackModal && (
                        <FeedbackModal onClose={() => setShowFeedbackModal(false)} profile={profile} />
                    )}
                    {viewingMemberProfile && (
                        <MemberProfileModal 
                            profile={viewingMemberProfile} 
                            hours={hours} 
                            isPresident={isPresident}
                            onClose={() => setViewingMemberProfile(null)} 
                            onEraseMember={handleEraseMember}
                        />
                    )}
                </div>
            );
        }

        // ==========================================
        // DYNAMIC BACKGROUND FX (High Performance DOM)
        // ==========================================
        function BackgroundFX({ darkMode }) {
            const glow1Ref = useRef(null);
            const glow2Ref = useRef(null);

            useEffect(() => {
                let rafId;
                const handleMouseMove = (e) => {
                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(() => {
                        if (glow1Ref.current) {
                            glow1Ref.current.style.transform = `translate3d(${e.clientX - (window.innerWidth*0.3)}px, ${e.clientY - (window.innerWidth*0.3)}px, 0)`;
                        }
                        if (glow2Ref.current) {
                            glow2Ref.current.style.transform = `translate3d(${e.clientX - (window.innerWidth*0.2) + 100}px, ${e.clientY - (window.innerWidth*0.2) - 100}px, 0)`;
                        }
                    });
                };
                window.addEventListener('mousemove', handleMouseMove, { passive: true });
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    cancelAnimationFrame(rafId);
                };
            }, []);

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-0 bg-[#F4F4F0] dark:bg-[#0a0a0a]">
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA0MCAwIEwgMCAwIDAgNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgwLDAsMCwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] dark:bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA0MCAwIEwgMCAwIDAgNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] opacity-50"></div>
                    
                    <div 
                        ref={glow1Ref}
                        className="absolute rounded-full blur-[100px] opacity-75 dark:opacity-50 saturate-200 pointer-events-none transition-transform duration-75 ease-out"
                        style={{ 
                            width: '60vw', height: '60vw',
                            background: 'radial-gradient(circle, #433f92 0%, transparent 70%)',
                            willChange: 'transform'
                        }}
                    />
                    <div 
                        ref={glow2Ref}
                        className="absolute rounded-full blur-[80px] opacity-60 dark:opacity-35 saturate-200 pointer-events-none transition-transform duration-100 ease-out"
                        style={{ 
                            width: '40vw', height: '40vw',
                            background: 'radial-gradient(circle, #ec8b3f 0%, transparent 70%)',
                            willChange: 'transform'
                        }}
                    />
                </div>
            );
        }

        // ==========================================
        // MEMBERS DIRECTORY & COMPLETE PROFILE VIEW
        // ==========================================
        function MembersDirectoryView({ profiles, hours, isPresident, onOpenMemberProfile, onEraseMember }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedSector, setSelectedSector] = useState('All');

            // Strictly filter out any removed, banned, or blank profiles
            const activeMembers = profiles.filter(p => 
                p.status !== 'Removed' && 
                p.status !== 'Banned' && 
                p.status !== 'deleted' && 
                p.name
            );

            const filteredMembers = activeMembers.filter(p => {
                const term = searchTerm.toLowerCase().trim();
                const matchesName = p.name && p.name.toLowerCase().includes(term);
                const matchesNick = p.nickname && p.nickname.toLowerCase().includes(term);
                const matchesClass = p.schoolClass && p.schoolClass.toLowerCase().includes(term);
                const matchesSearch = term === '' || matchesName || matchesNick || matchesClass;

                const matchesSector = selectedSector === 'All' || p.sector === selectedSector;
                return matchesSearch && matchesSector;
            });

            return (
                <div className="space-y-8 animate-fade-in-up">
                    <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-l-8 border-[#433f92] pl-4">
                        <div>
                            <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white">Club Directory</h1>

                        </div>
                        <span className="font-mono text-xs font-bold px-3 py-1 bg-black text-white self-start md:self-auto uppercase">
                            {filteredMembers.length} Active {filteredMembers.length === 1 ? 'Member' : 'Members'}

                    </div>

                    {/* Search & Sector Filters */}
                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92] space-y-4">
                        <div className="relative">
                            <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" size={20} />
                            <input 
                                type="text"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                placeholder="Search by name, nickname, or class (e.g. Bilgee, Anand, 11A)..."
                                className="w-full pl-12 pr-4 py-3 border-2 border-black dark:border-gray-600 bg-gray-50 dark:bg-gray-900 font-bold text-sm outline-none focus:border-[#ec8b3f]"

                                <button
                                    key={sec}

                                >
                                    {sec}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Members Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

                            const userApprovedHours = hours
                                .filter(h => h.userId === m.userId && h.status === 'Approved')

                            return (
                                <div 
                                    key={m.id || m.userId}

                                >
                                    <div>
                                        <div className="flex items-start gap-4 mb-4">
                                            <div className="w-14 h-14 bg-black border-2 border-black text-white flex items-center justify-center font-black text-xl shrink-0 overflow-hidden">
                                                {m.avatar ? (
                                                    <img src={m.avatar} alt="avatar" className="w-full h-full object-cover"/>
                                                ) : (
                                                    m.nickname ? m.nickname.charAt(0).toUpperCase() : m.name.charAt(0).toUpperCase()
                                                )}
                                            </div>
                                            <div className="overflow-hidden flex-1">
                                                <h3 className="font-black text-lg uppercase tracking-tight truncate leading-tight">{m.name}</h3>
                                                {m.nickname && (
                                                    <p className="text-xs font-bold text-[#ec8b3f] font-mono truncate">"{m.nickname}"</p>
                                                )}
                                                <p className="text-[10px] font-black uppercase tracking-widest text-gray-500 mt-1 truncate">{m.role}</p>
                                            </div>
                                        </div>

                                        <div className="space-y-1 text-xs font-mono pt-3 border-t-2 border-dashed border-gray-200 dark:border-gray-700">
                                            <div className="flex justify-between items-center">
                                                <span className="text-gray-500 font-bold uppercase text-[10px]">Sector:</span>
                                                <span className="font-bold truncate max-w-[170px]">{m.sector}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-gray-500 font-bold uppercase text-[10px]">Class:</span>
                                                <span className="font-black uppercase">{m.schoolClass || 'N/A'}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-gray-500 font-bold uppercase text-[10px]">Service Time:</span>
                                                <span className="font-black text-[#433f92] dark:text-[#a09df0]">{userApprovedHours} hrs</span>

                                        </span>
                                        {isPresident && m.role !== ROLES.PRESIDENT && (
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    onEraseMember(m);
                                                }}
                                                className="bg-red-600 hover:bg-black text-white text-[10px] font-black uppercase px-2.5 py-1 border border-black transition-colors"
                                                title="Completely erase and revoke member"
                                            >
                                                Revoke
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {filteredMembers.length === 0 && (
                        <div className="p-12 border-4 border-black bg-white dark:bg-gray-800 text-center space-y-2">
                            <p className="font-black text-xl uppercase tracking-tighter">No active members found</p>
                            <p className="text-sm font-mono text-gray-500">No member matches your search "{searchTerm}".</p>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // IDENTITY GATE & REGISTRATION
        // ==========================================
        function IdentityGate({ profiles }) {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [schoolClass, setSchoolClass] = useState('');
            const [role, setRole] = useState(ROLES.MEMBER);
            const [sector, setSector] = useState(SECTORS[0]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [rememberMe, setRememberMe] = useState(true);

            useEffect(() => {
                const saved = localStorage.getItem('khasu_saved_email');
                if (saved) {
                    setEmail(saved);
                    setRememberMe(true);
                }
            }, []);

            const handleRoleChange = (e) => {
                const newRole = e.target.value;
                setRole(newRole);
                if (newRole === ROLES.PRESIDENT) setSector('Global');
                else if (newRole === ROLES.HEAD_FINANCE) setSector('Finance & Marketing');
                else if (newRole === ROLES.HEAD_EVENTS) setSector('Events & Operations');
                else if (newRole === ROLES.HEAD_COMMUNITY) setSector('Community & Partnership');
                else if (newRole === ROLES.HEAD_MEDIA) setSector('Creative & Media');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                
                try {
                    if (rememberMe) {
                        localStorage.setItem('khasu_saved_email', email);
                    } else {
                        localStorage.removeItem('khasu_saved_email');
                    }

                    if (!isLogin) {
                        if (!email.endsWith('@orkhonschool.edu.mn')) {
                            throw new Error("Only @orkhonschool.edu.mn emails are allowed to register.");
                        }
                        const exists = profiles.some(p => p.email.toLowerCase() === email.toLowerCase());
                        if (exists) throw new Error("Email already registered. Please login.");
                        if (!phone || !schoolClass) throw new Error("Phone number and School Class are mandatory.");
                        
                        // Create Auth User
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        
                        // Create Profile in Firestore
                        await db.collection('profiles').doc(cred.user.uid).set({
                            userId: cred.user.uid,
                            name, nickname: '', email, phone, schoolClass, role, sector, status: 'Active', joinedAt: Date.now()
                        });

                    } else {
                        // Firebase Login
                        await auth.signInWithEmailAndPassword(email, password);
                    }

                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-[#F4F4F0] flex items-center justify-center p-6 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA0MCAwIEwgMCAwIDAgNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgwLDAsMCwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')]">
                    <div className="bg-white p-8 border-4 border-black w-full max-w-md shadow-[12px_12px_0px_0px_#433f92] animate-fade-in-up max-h-[92vh] overflow-y-auto custom-scrollbar">
                        <h1 className="text-3xl font-black mb-2 text-[#433f92] uppercase tracking-tighter">KhaSu Interact</h1>
                        <p className="text-sm font-bold text-gray-500 mb-8 border-b-2 border-black pb-4 uppercase tracking-widest">
                            {isLogin ? 'Establish Identity' : 'Submit Application'}
                        </p>

                        {error && <div className="bg-red-100 text-red-700 p-3 mb-6 font-bold text-xs uppercase border-2 border-red-700">{error}</div>}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <div>
                                    <label className="block text-xs uppercase font-black text-black mb-1">Full Name</label>
                                    <input required type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-bold text-sm" />
                                </div>
                            )}
                            
                            <div>
                                <label className="block text-xs uppercase font-black text-black mb-1">School Email (@orkhonschool.edu.mn)</label>
                                <input required type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-mono text-sm" />
                            </div>
                            
                            <div>
                                <label className="block text-xs uppercase font-black text-black mb-1">Password</label>
                                <input required type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-mono text-sm" />
                            </div>

                            {!isLogin && (
                                <>
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black text-black mb-1">Phone Number</label>
                                            <input required type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="99112233" className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-mono text-sm" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black text-black mb-1">Class</label>
                                            <input required type="text" value={schoolClass} onChange={e=>setSchoolClass(e.target.value)} placeholder="11A, 10B..." className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-bold uppercase text-sm" />
                                        </div>
                                    </div>
                                    <div className="flex gap-3">
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black text-black mb-1">Role</label>
                                            <select value={role} onChange={handleRoleChange} className="w-full border-2 border-gray-300 rounded-none p-3 outline-none font-bold uppercase text-xs cursor-pointer focus:border-[#433f92]">
                                                {Object.values(ROLES).map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black text-black mb-1">Sector</label>
                                            <select value={sector} onChange={(e) => setSector(e.target.value)} className={`w-full border-2 border-gray-300 rounded-none p-3 outline-none font-bold uppercase text-xs focus:border-[#433f92] ${role !== ROLES.MEMBER ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'cursor-pointer'}`} disabled={role !== ROLES.MEMBER}>
                                                {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </>
                            )}

                            <div className="flex items-center gap-2 mt-2">
                                <input type="checkbox" id="remember" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="w-4 h-4 cursor-pointer accent-[#433f92]" />
                                <label htmlFor="remember" className="text-xs font-bold text-gray-600 uppercase cursor-pointer tracking-widest">Remember my email</label>
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-[#ec8b3f] hover:bg-black text-white p-4 font-black uppercase tracking-widest transition-colors mt-6 disabled:opacity-50">
                                {loading ? 'Processing...' : (isLogin ? 'Enter Portal' : 'Register')}
                            </button>
                        </form>

                        <p className="mt-6 text-center text-xs font-bold text-gray-500">
                            {isLogin ? "Don't have an account?" : "Already have an account?"} 
                            <button onClick={() => setIsLogin(!isLogin)} className="ml-2 text-[#433f92] hover:underline uppercase tracking-widest">
                                {isLogin ? 'Apply Here' : 'Log In'}

        function BannedScreen() {
            return (
                <div className="min-h-screen bg-black flex flex-col items-center justify-center p-6 text-center">

                    <h1 className="text-4xl font-black text-white uppercase tracking-widest mb-4">Access Revoked</h1>

        // --- ADMIN & SPREADSHEET VIEW ---
        function AdminView({ profiles, isPresident, reports, currentUser, eventRecruitments, onOpenMemberProfile, onEraseMember }) {
            const [selectedUsers, setSelectedUsers] = useState([]);
            const [lastChecked, setLastChecked] = useState(null);
            
            const [bulkSector, setBulkSector] = useState('');
            const [bulkHours, setBulkHours] = useState('');
            const [adminSearch, setAdminSearch] = useState('');

            // Hide removed members and filter out other Presidents
            const targetProfiles = profiles.filter(p => 
                p.status !== 'Removed' && 
                p.status !== 'Banned' && 
                p.status !== 'deleted' && 
                p.name && 
                (p.userId === currentUser.userId || p.role !== ROLES.PRESIDENT)
            );

            const filteredProfiles = targetProfiles.filter(p => {
                const term = adminSearch.toLowerCase().trim();
                if (!term) return true;
                const matchesName = p.name && p.name.toLowerCase().includes(term);
                const matchesNick = p.nickname && p.nickname.toLowerCase().includes(term);
                const matchesClass = p.schoolClass && p.schoolClass.toLowerCase().includes(term);
                const matchesSector = p.sector && p.sector.toLowerCase().includes(term);
                return matchesName || matchesNick || matchesClass || matchesSector;
            });

            const handleSendEmail = (targetEmail, subject, body) => {
                window.location.href = `mailto:${targetEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}

--
Sent by ${currentUser.name}, ${currentUser.role}
KhaSu Interact Club`;
            };

            const handleDismissReport = async (reportId) => {
                await db.collection('reports').doc(reportId).update({ status: 'Dismissed' });
            };

            // --- MASS SELECT LOGIC (Shift-Click) ---
            const handleCheck = (e, userId, index) => {
                let newSelected = [...selectedUsers];
                if (e.shiftKey && lastChecked !== null) {
                    const start = Math.min(index, lastChecked);
                    const end = Math.max(index, lastChecked);
                    const rangeIds = filteredProfiles.slice(start, end + 1).map(p => p.userId);
                    rangeIds.forEach(id => { if (!newSelected.includes(id)) newSelected.push(id); });
                } else {
                    if (newSelected.includes(userId)) {
                        newSelected = newSelected.filter(id => id !== userId);
                    } else {
                        newSelected.push(userId);
                    }
                }
                setSelectedUsers(newSelected);
                setLastChecked(index);
            };

            const toggleAll = (e) => {
                if (e.target.checked) setSelectedUsers(filteredProfiles.map(p => p.userId));
                else setSelectedUsers([]);
            };

            // --- BULK ACTIONS (Complete Erase) ---
            const handleBulkErase = async () => {
                if (!window.confirm(`Are you sure you want to completely erase ${selectedUsers.length} selected users from the database and rosters?`)) return;
                
                for (const uid of selectedUsers) {
                    await db.collection('profiles').doc(uid).delete();
                    
                    const recsToUpdate = (eventRecruitments || []).filter(r => r.applicants && r.applicants.includes(uid));
                    for (const r of recsToUpdate) {
                        const newApps = r.applicants.filter(id => id !== uid);
                        await db.collection('eventRecruitments').doc(r.id).update({ applicants: newApps });
                    }
                }
                setSelectedUsers([]);
                alert("Selected members completely erased.");
            };

            const handleBulkSectorChange = async () => {
                if (!bulkSector || selectedUsers.length === 0) return;
                const promises = selectedUsers.map(id => db.collection('profiles').doc(id).update({ sector: bulkSector }));
                await Promise.all(promises);
                setSelectedUsers([]); setBulkSector('');
                alert("Sectors updated.");
            };

            const handleBulkHoursAdjust = async () => {
                if (!bulkHours || selectedUsers.length === 0) return;
                const promises = selectedUsers.map(uid => {
                    const p = profiles.find(x => x.userId === uid);
                    if (!p) return Promise.resolve();
                    return db.collection('hours').add({
                        userId: uid, userName: p.name, amount: Number(bulkHours),
                        description: `Admin Adjustment by ${currentUser.name}`, status: 'Approved', timestamp: Date.now()
                    });
                });
                await Promise.all(promises);
                setSelectedUsers([]); setBulkHours('');
                alert(`Logged ${bulkHours} hrs for ${selectedUsers.length} members.`);
            };

            return (
                <div className="space-y-12 animate-fade-in-up">
                    
                    {isPresident && (
                        <div className="bg-[#f4f4f0] dark:bg-gray-900 border-2 border-red-600 p-6 shadow-[8px_8px_0px_0px_#dc2626]">
                            <h2 className="text-3xl font-black mb-6 text-red-600 uppercase tracking-tighter border-b-4 border-red-600 pb-2">Official Reports Review</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {reports.filter(r => r.status === 'Open').map(r => (
                                    <div key={r.id} className="bg-white dark:bg-gray-800 p-6 border-4 border-red-600 relative">
                                        <div className="absolute top-0 right-0">
                                            <button onClick={() => handleDismissReport(r.id)} className="text-xs font-black uppercase tracking-widest text-white bg-gray-400 hover:bg-black px-3 py-2 transition-colors">Dismiss</button>
                                        </div>
                                        <p className="text-[10px] uppercase font-black text-gray-500 mb-1 tracking-widest">Filed By: {r.reporterName}</p>
                                        <p className="font-bold mb-4">Target: <span className="text-red-600">{r.reportedUserName}</span></p>
                                        <p className="font-mono text-sm bg-gray-100 dark:bg-gray-900 p-4 border-l-4 border-red-600">{r.reason}</p>
                                    </div>
                                ))}
                                {reports.filter(r => r.status === 'Open').length === 0 && (
                                    <p className="text-gray-500 font-mono text-sm">No open reports.</p>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-gray-900 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92] space-y-6">
                        <div className="flex flex-col sm:flex-row sm:items-end justify-between border-b-4 border-black pb-4 gap-4">
                            <div>
                                <h2 className="text-3xl font-black uppercase tracking-tighter">Club Roster Spreadsheet</h2>
                                <p className="text-xs font-mono text-gray-500">Real-time member registry and authorization control</p>
                            </div>
                            <span className="text-sm font-mono font-bold bg-black text-white px-3 py-1 self-start sm:self-auto uppercase">
                                {selectedUsers.length} Selected
                            </span>
                        </div>

                        {/* Search Toolbar for Spreadsheet */}
                        <div className="relative">
                            <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                            <input 
                                type="text"
                                value={adminSearch}
                                onChange={(e) => setAdminSearch(e.target.value)}
                                placeholder="Search spreadsheet by name, nickname, class, or sector..."
                                className="w-full pl-12 pr-4 py-2.5 border-2 border-black dark:border-gray-600 bg-gray-50 dark:bg-gray-800 font-bold text-xs outline-none focus:border-[#ec8b3f]"
                            />
                            {adminSearch && (
                                <button onClick={() => setAdminSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-mono text-gray-400 hover:text-black dark:hover:text-white">
                                    CLEAR
                                </button>
                            )}
                        </div>

                        {/* Admin Action Toolbar */}
                        {isPresident && (
                            <div className="p-4 border-4 border-[#ec8b3f] bg-orange-50 dark:bg-gray-800 flex flex-wrap gap-4 items-end">
                                <div>
                                    <label className="block text-[10px] font-black uppercase mb-1">Mass Sector Shift</label>
                                    <div className="flex gap-2">
                                        <select value={bulkSector} onChange={e=>setBulkSector(e.target.value)} className="border-2 border-black p-2 text-xs font-bold uppercase outline-none dark:bg-gray-700">
                                            <option value="">Select Sector...</option>
                                            {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        <button onClick={handleBulkSectorChange} disabled={selectedUsers.length===0} className="bg-black text-white px-4 font-black text-xs uppercase border-2 border-transparent disabled:opacity-50">Apply</button>
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-[10px] font-black uppercase mb-1">Adjust Hours (+/-)</label>
                                    <div className="flex gap-2">
                                        <input type="number" step="0.5" value={bulkHours} onChange={e=>setBulkHours(e.target.value)} className="border-2 border-black p-2 text-xs font-mono w-24 outline-none dark:bg-gray-700" placeholder="e.g. 2.5" />
                                        <button onClick={handleBulkHoursAdjust} disabled={selectedUsers.length===0} className="bg-[#433f92] text-white px-4 font-black text-xs uppercase border-2 border-transparent disabled:opacity-50">Log</button>
                                    </div>
                                </div>

                                <div className="ml-auto">
                                    <button onClick={handleBulkErase} disabled={selectedUsers.length===0} className="bg-red-600 text-white px-6 py-2 font-black text-xs uppercase tracking-widest border-2 border-transparent hover:bg-black disabled:opacity-50">
                                        Revoke & Erase Selected
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* The Spreadsheet */}
                        <div className="overflow-x-auto border-4 border-black">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-black text-white uppercase text-xs tracking-widest">
                                        {isPresident && <th className="p-3 border-r-2 border-gray-700 w-12 text-center"><input type="checkbox" onChange={toggleAll} className="accent-[#ec8b3f] w-4 h-4 cursor-pointer"/></th>}
                                        <th className="p-3 border-r-2 border-gray-700">Name & Nickname</th>
                                        <th className="p-3 border-r-2 border-gray-700">Role</th>
                                        <th className="p-3 border-r-2 border-gray-700">Sector</th>
                                        <th className="p-3 border-r-2 border-gray-700">Phone & Class</th>
                                        <th className="p-3 border-r-2 border-gray-700">Status</th>
                                        <th className="p-3">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredProfiles.map((p, index) => {
                                        const isSelected = selectedUsers.includes(p.userId);
                                        return (
                                            <tr key={p.id} className={`border-b-2 border-gray-300 dark:border-gray-700 transition-colors ${isSelected ? 'bg-orange-100 dark:bg-orange-900/30' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                                {isPresident && (
                                                    <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-center">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={isSelected}
                                                            onChange={(e) => handleCheck(e, p.userId, index)}
                                                            className="accent-[#ec8b3f] w-4 h-4 cursor-pointer"
                                                        />
                                                    </td>
                                                )}
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 font-bold uppercase">
                                                    <button 
                                                        onClick={() => onOpenMemberProfile && onOpenMemberProfile(p)}
                                                        className="hover:text-[#ec8b3f] hover:underline text-left flex items-center gap-1.5"
                                                        title="Click to view dossier"
                                                    >
                                                        <span>{p.name}</span>
                                                        {p.nickname && <span className="text-gray-500 lowercase font-mono">({p.nickname})</span>}
                                                    </button>
                                                </td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-xs font-black text-[#ec8b3f] tracking-widest uppercase">{p.role}</td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-xs font-mono font-bold">{p.sector}</td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-xs font-mono">
                                                    <div>📞 {p.phone || 'N/A'}</div>
                                                    <div>🏫 {p.schoolClass || 'N/A'}</div>
                                                </td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700">
                                                    <span className="text-[10px] font-black uppercase tracking-widest px-2 py-1 bg-green-200 text-green-800">
                                                        {p.status || 'Active'}
                                                    </span>
                                                </td>
                                                <td className="p-3 flex items-center gap-3">
                                                    <button onClick={() => handleSendEmail(p.email, "KhaSu Interact Update", "")} className="text-xs font-mono text-blue-600 dark:text-blue-400 hover:underline hover:text-black">
                                                        Email
                                                    </button>
                                                    {isPresident && p.role !== ROLES.PRESIDENT && (
                                                        <button 
                                                            onClick={() => onEraseMember(p)} 
                                                            className="text-xs font-black uppercase text-red-600 hover:text-black dark:hover:text-white hover:underline"
                                                            title="Completely remove member from system"
                                                        >
                                                            Revoke
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                            {filteredProfiles.length === 0 && <p className="p-6 text-center font-mono text-sm text-gray-500">No active members found.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        // --- HOURS VIEW (Non-presidents only) ---
        function HoursView({ hours, profile, profiles }) {
            const pendingHours = hours.filter(h => h.status === 'Pending' && h.userId === profile.userId);
            const myHours = hours.filter(h => h.userId === profile.userId);

            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!amount || !desc) return;
                await db.collection('hours').add({
                    userId: profile.userId,
                    userName: profile.name,
                    amount: Number(amount),
                    description: desc,
                    status: 'Pending',
                    timestamp: Date.now()
                });
                setAmount(''); setDesc('');
            };

            return (
                <div className="space-y-8 animate-fade-in-up">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-[#ec8b3f] pl-4">Time Tracking</h1>

                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-4">Log Hours</h2>
                        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-4">

                            <input type="text" required placeholder="Description (e.g., Park Cleanup)" value={desc} onChange={e=>setDesc(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-bold flex-1" />
                            <button type="submit" className="bg-[#433f92] hover:bg-black text-white px-8 py-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Submit</button>
                        </form>
                    </div>

                    {pendingHours.length > 0 && (
                        <div className="bg-amber-50 dark:bg-amber-900/20 border-4 border-amber-500 p-6">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-4 text-amber-700 dark:text-amber-500">Your Pending Approvals</h2>
                            <div className="space-y-3">
                                {pendingHours.map(h => (
                                    <div key={h.id} className="flex justify-between items-center bg-white dark:bg-gray-800 p-4 border-2 border-amber-500">

                                            <p className="font-bold">{h.userName} - {h.amount} hrs</p>

                                        </div>
                                        <span className="text-xs font-black uppercase tracking-widest px-2 py-1 bg-amber-100 text-amber-700">Pending</span>

                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">

                        <div className="space-y-2">

                                    <span className="font-bold">{h.description}</span>
                                    <div className="flex gap-4 items-center">
                                        <span className="font-mono">{h.amount} hrs</span>

                                </div>

            const [nickname, setNickname] = useState(profile.nickname || '');
            const [avatar, setAvatar] = useState(profile.avatar || '');
            const [hobbies, setHobbies] = useState(profile.hobbies || '');
            const [skills, setSkills] = useState(profile.skills || '');

            const [pwdMsg, setPwdMsg] = useState('');
