<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhaSu Interact Club</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: { 900: '#433f92' },
                        orange: { 500: '#ec8b3f' }
                    }
                }
            }
        }
    </script>

    <!-- Custom Scrollbar & Animations -->
    <style>
        body { margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-left: 2px solid #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #000; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #1a1a1a; border-left: 2px solid #fff; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #fff; }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>

    <!-- Firebase Compat SDKs (Stable for single-file HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- ES Module Import Map for React/Lucide -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    
    <!-- Babel for JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            ShieldAlert, Calendar, Clock, DollarSign, 
            CheckCircle, XCircle, LogOut, CheckSquare, 
            Users, Menu, ChevronLeft, Moon, Sun, Flag, Gavel, Plus, AlertTriangle, Table, User, Mail, Edit3, Image as ImageIcon
        } from 'lucide-react';

        // ==========================================
        // 1. PASTE YOUR FIREBASE CONFIG HERE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCElkzEypV_0EhAewvqQtGZ9in1ER3T7M4",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- CONSTANTS & CONFIG ---
        const ROLES = {
            PRESIDENT: 'President',
            HEAD_FINANCE: 'Head of Finance & Marketing',
            HEAD_EVENTS: 'Head of Events & Operations',
            HEAD_COMMUNITY: 'Head of Community & Partnership',
            HEAD_MEDIA: 'Head of Creative & Media',
            MEMBER: 'Member'
        };

        const SECTORS = ['Finance & Marketing', 'Events & Operations', 'Community & Partnership', 'Creative & Media', 'Global'];

        const SECTOR_COLORS = {
            'Finance & Marketing': 'border-emerald-500 bg-emerald-50 text-emerald-900 dark:bg-emerald-900/30 dark:text-emerald-300',
            'Events & Operations': 'border-rose-500 bg-rose-50 text-rose-900 dark:bg-rose-900/30 dark:text-rose-300',
            'Community & Partnership': 'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-900/30 dark:text-amber-300',
            'Creative & Media': 'border-fuchsia-500 bg-fuchsia-50 text-fuchsia-900 dark:bg-fuchsia-900/30 dark:text-fuchsia-300',
            'Global': 'border-[#433f92] bg-[#433f92]/10 text-[#433f92] dark:bg-[#433f92]/30 dark:text-indigo-300'
        };

        // --- MAIN APPLICATION COMPONENT ---
        function App() {
            // Auth & Profile State
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loadingAuth, setLoadingAuth] = useState(true);
            
            // Data State
            const [profiles, setProfiles] = useState([]);
            const [treasury, setTreasury] = useState([]);
            const [hours, setHours] = useState([]);
            const [events, setEvents] = useState([]);
            const [reports, setReports] = useState([]);
            const [eventIdeas, setEventIdeas] = useState([]);
            const [eventRecruitments, setEventRecruitments] = useState([]);

            // UI State
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [showTreasuryModal, setShowTreasuryModal] = useState(false);
            const [themeTransition, setThemeTransition] = useState(null);

            // 1. Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const doc = await db.collection('profiles').doc(u.uid).get();
                        if (doc.exists) setProfile({ id: doc.id, userId: u.uid, ...doc.data() });
                    } else {
                        setProfile(null);
                    }
                    setLoadingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            // 2. Data Sync
            useEffect(() => {
                if (!user) return;
                
                const unsubs = [];
                const mapSnap = (snap) => snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                unsubs.push(db.collection('profiles').onSnapshot(snap => {
                    const data = mapSnap(snap);
                    setProfiles(data);
                    const myProfile = data.find(p => p.userId === user.uid);
                    if (myProfile) setProfile(myProfile);
                }));
                unsubs.push(db.collection('treasury').orderBy('timestamp', 'desc').onSnapshot(snap => setTreasury(mapSnap(snap))));
                unsubs.push(db.collection('hours').orderBy('timestamp', 'desc').onSnapshot(snap => setHours(mapSnap(snap))));
                unsubs.push(db.collection('events').orderBy('timestamp', 'desc').onSnapshot(snap => setEvents(mapSnap(snap))));
                unsubs.push(db.collection('reports').orderBy('timestamp', 'desc').onSnapshot(snap => setReports(mapSnap(snap))));
                unsubs.push(db.collection('eventIdeas').orderBy('timestamp', 'desc').onSnapshot(snap => setEventIdeas(mapSnap(snap))));
                unsubs.push(db.collection('eventRecruitments').orderBy('timestamp', 'desc').onSnapshot(snap => setEventRecruitments(mapSnap(snap))));

                return () => unsubs.forEach(unsub => unsub());
            }, [user]);

            const handleLogout = async () => {
                await auth.signOut();
            };

            // --- PERMISSIONS ---
            const isPresident = profile?.role === ROLES.PRESIDENT;
            const isHead = profile?.role?.startsWith('Head');
            const isFinance = profile?.role === ROLES.HEAD_FINANCE;
            const canModifyTreasury = isPresident || isFinance;

            // --- RADIAL THEME TOGGLE ---
            const handleToggleTheme = (e) => {
                const x = e.clientX;
                const y = e.clientY;
                const isGoingDark = !darkMode;
                setThemeTransition({ x, y, toDark: isGoingDark, progress: false });
                
                setTimeout(() => setThemeTransition(prev => ({ ...prev, progress: true })), 50);
                setTimeout(() => {
                    setDarkMode(isGoingDark);
                    if (isGoingDark) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                }, 400);
                setTimeout(() => setThemeTransition(null), 850);
            };

            // --- IDENTITY GATE ---
            if (loadingAuth) return <div className="min-h-screen flex items-center justify-center bg-[#F4F4F0] font-black uppercase tracking-widest">Verifying Connection...</div>;
            
            if (!user || !profile) {
                return <IdentityGate profiles={profiles} />;
            }

            if (profile.status === 'Removed') return <BannedScreen />;

            const currentBalance = treasury.reduce((acc, curr) => acc + Number(curr.amount), 0);

            // --- NAVIGATION CONFIG ---
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', Icon: CheckSquare },
                { id: 'events', label: 'Events & Roles', Icon: Calendar },
                { id: 'hours', label: 'Time Tracking', Icon: Clock },
                ...(!isPresident ? [{ id: 'reports', label: 'Report Center', Icon: Flag }] : []),
                ...((isPresident || isHead) ? [{ id: 'admin', label: 'Administration', Icon: ShieldAlert }] : [])
            ];

            const activeIndex = navItems.findIndex(item => item.id === activeTab);

            return (
                <div className="font-sans relative">
                    
                    {/* Radial Theme Transition Overlay */}
                    {themeTransition && (
                        <div 
                            className="fixed z-[9999] pointer-events-none"
                            style={{
                                left: themeTransition.x, top: themeTransition.y,
                                width: '1px', height: '1px', borderRadius: '50%',
                                boxShadow: `0 0 0 ${themeTransition.progress ? '150vmax' : '0'} ${themeTransition.toDark ? '#111827' : '#f9fafb'}`,
                                transition: 'box-shadow 0.8s ease-in-out'
                            }}
                        />
                    )}

                    <div className="flex h-screen overflow-hidden bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200 relative">
                        
                        <BackgroundFX darkMode={darkMode} />

                        {/* --- SIDEBAR --- */}
                        <nav className={`bg-white dark:bg-gray-800 border-r-2 border-gray-900 dark:border-gray-200 flex flex-col transition-all duration-300 z-20 shadow-[4px_0_0_0_rgba(0,0,0,0.1)] ${sidebarOpen ? 'w-64' : 'w-20'}`}>
                            <div className="p-4 flex items-center justify-between border-b-2 border-gray-900 dark:border-gray-200 h-16 bg-[#433f92] text-white">
                                {sidebarOpen && <span className="font-black text-xl tracking-tighter truncate">KHASU INTERACT</span>}
                                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-white/20 text-[#ec8b3f] transition-colors">
                                    {sidebarOpen ? <ChevronLeft size={20} /> : <Menu size={20} />}
                                </button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto py-4 relative px-2 custom-scrollbar">
                                <div 
                                    className="absolute left-2 right-2 h-12 bg-[#433f92]/10 dark:bg-[#433f92]/30 border-l-4 border-[#ec8b3f] transition-all duration-300 ease-out z-0"
                                    style={{ top: `calc(${activeIndex >= 0 ? activeIndex : -1} * 3rem + 1rem)`, opacity: activeIndex >= 0 ? 1 : 0 }}
                                />
                                
                                <div className="relative z-10 space-y-0">
                                    {navItems.map((item) => (
                                        <button 
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`flex items-center w-full h-12 px-3 transition-colors font-bold text-sm
                                            ${activeTab === item.id ? 'text-[#433f92] dark:text-indigo-300' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'}
                                            ${!sidebarOpen ? 'justify-center' : 'gap-3'}`}
                                            title={!sidebarOpen ? item.label : undefined}
                                        >
                                            <span className={activeTab === item.id ? 'text-[#ec8b3f]' : ''}><item.Icon size={20} /></span>
                                            {sidebarOpen && <span className="truncate">{item.label}</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div 
                                onClick={() => setActiveTab('profile')}
                                className={`p-4 border-t-2 border-gray-900 dark:border-gray-200 cursor-pointer transition-colors ${SECTOR_COLORS[profile.sector] || 'bg-gray-100 dark:bg-gray-800'} ${activeTab === 'profile' ? 'border-l-4 border-l-[#ec8b3f] brightness-95' : 'hover:brightness-95'}`}
                                title="My Profile"
                            >
                                <div className={`flex items-center ${sidebarOpen ? 'gap-3' : 'justify-center'} `}>
                                    <div className="w-10 h-10 rounded-none bg-black border-2 border-white text-white flex items-center justify-center font-bold overflow-hidden shrink-0">
                                        {profile.avatar ? <img src={profile.avatar} alt="avatar" className="w-full h-full object-cover"/> : profile.name.charAt(0)}
                                    </div>
                                    {sidebarOpen && (
                                        <div className="overflow-hidden">
                                            <p className="font-bold text-sm truncate">{profile.name}</p>
                                            <p className="text-[10px] font-black truncate uppercase opacity-80">{profile.role}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </nav>

                        {/* --- MAIN CONTENT AREA --- */}
                        <div className="flex-1 flex flex-col min-w-0 z-10 relative bg-transparent">
                            
                            {/* Topbar */}
                            <header className="h-16 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b-2 border-gray-900 dark:border-gray-200 flex items-center justify-between px-6 shadow-sm">
                                <div 
                                    onClick={() => canModifyTreasury ? setShowTreasuryModal(true) : null}
                                    className={`flex items-center gap-2 px-4 py-1.5 border-2 border-gray-900 dark:border-gray-200 bg-white dark:bg-gray-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,0.1)] ${canModifyTreasury ? 'cursor-pointer hover:border-[#ec8b3f] hover:translate-y-[-1px] transition-transform' : ''}`}
                                >
                                    <DollarSign size={16} className="text-[#ec8b3f]" />
                                    <span className="font-mono font-black text-sm text-[#433f92] dark:text-[#a09df0]">₮{currentBalance.toLocaleString()}</span>
                                </div>

                                <button onClick={handleToggleTheme} className="p-2 border-2 border-gray-900 dark:border-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-[#433f92] dark:text-[#ec8b3f] transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,0.1)]">
                                    {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                                </button>
                            </header>

                            {/* Content Body */}
                            <main className="flex-1 overflow-y-auto p-6 md:p-8 custom-scrollbar relative">
                                {activeTab === 'dashboard' && <DashboardView treasury={currentBalance} hours={hours} profiles={profiles} profile={profile} events={events} eventRecruitments={eventRecruitments} />}
                                {activeTab === 'profile' && <ProfileView profile={profile} onLogout={handleLogout} />}
                                {activeTab === 'events' && <EventsView events={events} eventIdeas={eventIdeas} profile={profile} isPresident={isPresident} isHead={isHead} eventRecruitments={eventRecruitments} />}
                                {activeTab === 'hours' && <HoursView hours={hours} profile={profile} isPresident={isPresident} isHead={isHead} profiles={profiles} />}
                                {activeTab === 'reports' && !isPresident && <ReportsView reports={reports} profile={profile} profiles={profiles} />}
                                {activeTab === 'admin' && (isPresident || isHead) && <AdminView profiles={profiles} isPresident={isPresident} reports={reports} currentUser={profile} />}
                            </main>

                        </div>
                    </div>

                    {/* Treasury Modal (For President/Finance) */}
                    {showTreasuryModal && canModifyTreasury && (
                        <TreasuryModal 
                            onClose={() => setShowTreasuryModal(false)} 
                            profile={profile} balance={currentBalance} treasuryRecords={treasury}
                        />
                    )}
                </div>
            );
        }

        // ==========================================
        // DYNAMIC BACKGROUND FX
        // ==========================================
        function BackgroundFX({ darkMode }) {
            const [mousePos, setMousePos] = useState({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

            useEffect(() => {
                let animationFrameId;
                const handleMouseMove = (e) => {
                    animationFrameId = requestAnimationFrame(() => {
                        setMousePos({ x: e.clientX, y: e.clientY });
                    });
                };
                window.addEventListener('mousemove', handleMouseMove);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden z-0 bg-[#F4F4F0] dark:bg-[#0a0a0a]">
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA0MCAwIEwgMCAwIDAgNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgwLDAsMCwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] dark:bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA0MCAwIEwgMCAwIDAgNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')] opacity-50"></div>
                    
                    <div 
                        className="absolute rounded-full blur-[100px] opacity-40 dark:opacity-20 transition-transform duration-1000 ease-out"
                        style={{ 
                            width: '60vw', height: '60vw',
                            background: 'radial-gradient(circle, #433f92 0%, transparent 70%)',
                            transform: `translate(${mousePos.x - (window.innerWidth*0.3)}px, ${mousePos.y - (window.innerWidth*0.3)}px)`
                        }}
                    />
                    <div 
                        className="absolute rounded-full blur-[80px] opacity-30 dark:opacity-10 transition-transform duration-[1500ms] ease-out delay-75"
                        style={{ 
                            width: '40vw', height: '40vw',
                            background: 'radial-gradient(circle, #ec8b3f 0%, transparent 70%)',
                            transform: `translate(${mousePos.x - (window.innerWidth*0.2) + 100}px, ${mousePos.y - (window.innerWidth*0.2) - 100}px)`
                        }}
                    />
                </div>
            );
        }

        // ==========================================
        // VIEWS & COMPONENTS
        // ==========================================

        function IdentityGate({ profiles }) {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [role, setRole] = useState(ROLES.MEMBER);
            const [sector, setSector] = useState(SECTORS[0]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [rememberMe, setRememberMe] = useState(true);

            useEffect(() => {
                const saved = localStorage.getItem('khasu_saved_email');
                if (saved) {
                    setEmail(saved);
                    setRememberMe(true);
                }
            }, []);

            const handleRoleChange = (e) => {
                const newRole = e.target.value;
                setRole(newRole);
                if (newRole === ROLES.PRESIDENT) setSector('Global');
                else if (newRole === ROLES.HEAD_FINANCE) setSector('Finance & Marketing');
                else if (newRole === ROLES.HEAD_EVENTS) setSector('Events & Operations');
                else if (newRole === ROLES.HEAD_COMMUNITY) setSector('Community & Partnership');
                else if (newRole === ROLES.HEAD_MEDIA) setSector('Creative & Media');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                
                try {
                    if (rememberMe) {
                        localStorage.setItem('khasu_saved_email', email);
                    } else {
                        localStorage.removeItem('khasu_saved_email');
                    }

                    if (!isLogin) {
                        if (!email.endsWith('@orkhonschool.edu.mn')) {
                            throw new Error("Only @orkhonschool.edu.mn emails are allowed to register.");
                        }
                        const exists = profiles.some(p => p.email === email);
                        if (exists) throw new Error("Email already registered. Please login.");
                        
                        // Create Auth User
                        const cred = await auth.createUserWithEmailAndPassword(email, password);
                        
                        // Create Profile in Firestore
                        await db.collection('profiles').doc(cred.user.uid).set({
                            userId: cred.user.uid,
                            name, email, role, sector, status: 'Active', joinedAt: Date.now()
                        });

                    } else {
                        // Firebase Login
                        await auth.signInWithEmailAndPassword(email, password);
                    }

                } catch (err) {
                    setError(err.message);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-[#F4F4F0] flex items-center justify-center p-6 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSA0MCAwIEwgMCAwIDAgNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0icmdiYSgwLDAsMCwwLjA1KSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2dyaWQpIi8+PC9zdmc+')]">
                    <div className="bg-white p-8 border-4 border-black w-full max-w-md shadow-[12px_12px_0px_0px_#433f92] animate-fade-in-up">
                        <h1 className="text-3xl font-black mb-2 text-[#433f92] uppercase tracking-tighter">KhaSu Interact</h1>
                        <p className="text-sm font-bold text-gray-500 mb-8 border-b-2 border-black pb-4 uppercase tracking-widest">
                            {isLogin ? 'Establish Identity' : 'Submit Application'}
                        </p>

                        {error && <div className="bg-red-100 text-red-700 p-3 mb-6 font-bold text-xs uppercase border-2 border-red-700">{error}</div>}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <div>
                                    <label className="block text-xs uppercase font-black text-black mb-1">Full Name</label>
                                    <input required type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-bold text-sm" />
                                </div>
                            )}
                            
                            <div>
                                <label className="block text-xs uppercase font-black text-black mb-1">School Email (@orkhonschool.edu.mn)</label>
                                <input required type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full border-2 border-gray-300 rounded-none p-3 outline-none focus:border-[#433f92] font-mono text-sm" />
                            </div>
                            
                            <div>
                                <label className="block text-xs uppercase font-black text-black mb-1">Password</label>

        function BannedScreen() {

        // --- CALENDAR COMPONENT ---
        function DashboardCalendar({ events, eventRecruitments, profile }) {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedEvent, setSelectedEvent] = useState(null);
            
            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
            const firstDayOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
            
            const blanks = Array.from({ length: firstDayOfMonth }, (_, i) => i);
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

            const getEventsForDay = (day) => {
                return events.filter(ev => {
                    const d = new Date(ev.date);
                    return d.getFullYear() === currentDate.getFullYear() && d.getMonth() === currentDate.getMonth() && d.getDate() === day;
                });
            };

            const handleApply = async (recruitment) => {
                if (recruitment.applicants && recruitment.applicants.includes(profile.userId)) {
                    alert("You have already applied for this role.");
                    return;
                }
                const updatedApplicants = [...(recruitment.applicants || []), profile.userId];
                await db.collection('eventRecruitments').doc(recruitment.id).update({ applicants: updatedApplicants });
                alert("Applied successfully!");
                setSelectedEvent(null);
            };

            return (
                <>
                    <div className="bg-white dark:bg-gray-800 border-4 border-black shadow-[8px_8px_0px_0px_#433f92] flex flex-col h-full relative">
                        <div className="flex justify-between items-center bg-black text-white p-3">
                            <button onClick={prevMonth} className="p-1 hover:text-[#ec8b3f] transition-colors"><ChevronLeft size={24}/></button>
                            <h2 className="text-lg font-black uppercase tracking-widest">{monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}</h2>
                            <button onClick={nextMonth} className="p-1 hover:text-[#ec8b3f] transition-colors"><ChevronLeft size={24} className="rotate-180"/></button>
                        </div>
                        <div className="grid grid-cols-7 gap-px bg-black border-b-4 border-black">
                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                <div key={day} className="bg-gray-100 dark:bg-gray-900 text-center text-[10px] sm:text-xs font-black uppercase py-2">{day}</div>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 gap-px bg-black flex-1">
                            {blanks.map(b => <div key={`blank-${b}`} className="bg-white dark:bg-gray-800 min-h-[60px] sm:min-h-[80px]"></div>)}
                            {days.map(d => {
                                const dayEvents = getEventsForDay(d);
                                const isToday = new Date().toDateString() === new Date(currentDate.getFullYear(), currentDate.getMonth(), d).toDateString();
                                return (
                                    <div key={d} className={`bg-white dark:bg-gray-800 min-h-[60px] sm:min-h-[80px] p-1 sm:p-2 flex flex-col ${isToday ? 'bg-[#ec8b3f]/10 dark:bg-[#ec8b3f]/20' : ''}`}>
                                        <span className={`text-xs sm:text-sm font-bold ${isToday ? 'text-[#ec8b3f] underline' : 'text-gray-700 dark:text-gray-300'}`}>{d}</span>
                                        <div className="flex-1 overflow-y-auto mt-1 space-y-1 custom-scrollbar">
                                            {dayEvents.map((ev, idx) => (
                                                <div 
                                                    key={idx} 
                                                    onClick={() => setSelectedEvent(ev)}
                                                    className="text-[8px] sm:text-[9px] font-black uppercase bg-[#433f92] hover:bg-[#ec8b3f] transition-colors text-white p-0.5 sm:p-1 truncate cursor-pointer" 
                                                    title={ev.title}
                                                >
                                                    {ev.title}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Event Details Modal */}
                    {selectedEvent && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-black w-full max-w-lg shadow-[15px_15px_0px_0px_#ec8b3f] animate-fade-in-up">
                                <div className="p-4 bg-black text-white flex justify-between items-center border-b-4 border-black">
                                    <h2 className="font-black text-xl uppercase tracking-tighter truncate">{selectedEvent.title}</h2>
                                    <button onClick={() => setSelectedEvent(null)} className="p-1 hover:text-[#ec8b3f] transition-colors"><XCircle size={24}/></button>
                                </div>
                                <div className="p-6">
                                    <p className="text-xs font-black uppercase tracking-widest text-gray-500 mb-2">Date: {new Date(selectedEvent.date).toLocaleDateString()}</p>
                                    <p className="font-mono text-sm mb-6 pb-4 border-b-2 border-dashed border-gray-400">{selectedEvent.description}</p>
                                    
                                    <h3 className="font-black uppercase tracking-widest mb-4">Open Roles</h3>
                                    <div className="space-y-4 max-h-60 overflow-y-auto custom-scrollbar">
                                        {eventRecruitments.filter(r => r.eventId === selectedEvent.id).map(r => {
                                            const applicantCount = r.applicants ? r.applicants.length : 0;
                                            const isFull = applicantCount >= Number(r.capacity);
                                            const hasApplied = r.applicants && r.applicants.includes(profile.userId);
                                            
                                            return (
                                                <div key={r.id} className={`p-4 border-2 border-black ${isFull ? 'bg-gray-200 dark:bg-gray-800 opacity-60' : 'bg-white dark:bg-gray-700'}`}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <h4 className="font-black uppercase">{r.roleName}</h4>
                                                        <span className="text-xs font-bold bg-[#ec8b3f] text-black px-2 py-1 uppercase">{r.potentialHours} Hrs</span>
                                                    </div>
                                                    <p className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Sector: {r.sector}</p>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-sm font-mono">{applicantCount} / {r.capacity} Filled</span>
                                                        <button 
                                                            onClick={() => handleApply(r)}
                                                            disabled={isFull || hasApplied || profile.role !== ROLES.MEMBER}
                                                            className={`text-xs font-black uppercase tracking-widest px-3 py-1 border-2 border-black ${isFull || hasApplied || profile.role !== ROLES.MEMBER ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-[#433f92] text-white hover:bg-black transition-colors'}`}
                                                        >
                                                            {hasApplied ? 'Applied' : isFull ? 'Full' : 'Apply'}
                                                        </button>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                        {eventRecruitments.filter(r => r.eventId === selectedEvent.id).length === 0 && (
                                            <p className="text-xs font-mono text-gray-500 uppercase">No recruitment postings for this event yet.</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // --- DASHBOARD VIEW ---
        function DashboardView({ treasury, hours, profiles, profile, events, eventRecruitments }) {
            const userHours = hours.filter(h => h.userId === profile.userId && h.status === 'Approved');
            const totalUserHours = userHours.reduce((acc, h) => acc + Number(h.amount), 0);
            
            const allApproved = hours.filter(h => h.status === 'Approved');
            const leaderboard = Object.values(allApproved.reduce((acc, h) => {
                acc[h.userId] = acc[h.userId] || { name: h.userName, total: 0 };
                acc[h.userId].total += Number(h.amount);
                return acc;
            }, {})).sort((a,b) => b.total - a.total).slice(0, 5);

            return (
                <div className="space-y-8 animate-fade-in-up">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-[#ec8b3f] pl-4">Overview</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-[#433f92] p-6 border-4 border-black text-white shadow-[8px_8px_0px_0px_#000]">
                            <p className="text-xs uppercase font-black tracking-widest mb-2 opacity-80">Your Hours</p>
                            <p className="text-6xl font-black">{totalUserHours} <span className="text-2xl">hrs</span></p>
                        </div>
                        <div className="bg-[#ec8b3f] p-6 border-4 border-black text-black shadow-[8px_8px_0px_0px_#000]">
                            <p className="text-xs uppercase font-black tracking-widest mb-2 opacity-80">Treasury Reserve</p>
                            <p className="text-4xl font-black mt-4">₮{treasury.toLocaleString()}</p>
                        </div>
                        <div className="bg-white dark:bg-gray-800 p-6 border-4 border-black shadow-[8px_8px_0px_0px_#433f92]">
                            <p className="text-xs uppercase font-black tracking-widest mb-2 text-gray-500">Active Members</p>
                            <p className="text-6xl font-black text-gray-900 dark:text-white">{profiles.filter(p => p.status === 'Active').length}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2">
                            <DashboardCalendar events={events || []} eventRecruitments={eventRecruitments} profile={profile} />
                        </div>
                        
                        <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)] h-full">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-4 border-b-2 border-black pb-2">Top Volunteers</h2>
                            <div className="space-y-2">
                                {leaderboard.map((u, i) => (
                                    <div key={i} className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700 border-2 border-transparent hover:border-[#ec8b3f] transition-colors">
                                        <span className="font-bold">{i+1}. {u.name}</span>
                                        <span className="font-black text-[#433f92] dark:text-[#a09df0]">{u.total} hrs</span>
                                    </div>
                                ))}
                                {leaderboard.length === 0 && <p className="text-gray-500 font-mono text-sm">No approved hours yet.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- EVENTS VIEW ---
        function EventsView({ events, eventIdeas, profile, isPresident, isHead, eventRecruitments }) {
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [description, setDescription] = useState('');
            
            const [ideaTitle, setIdeaTitle] = useState('');
            const [ideaDate, setIdeaDate] = useState('');
            const [ideaDesc, setIdeaDesc] = useState('');

            const [recruitmentEventId, setRecruitmentEventId] = useState('');
            const [recruitmentRole, setRecruitmentRole] = useState('');
            const [recruitmentCapacity, setRecruitmentCapacity] = useState('');
            const [recruitmentHours, setRecruitmentHours] = useState('');

            const handleCreateEvent = async (e) => {
                e.preventDefault();
                if (!title || !date) return;
                await db.collection('events').add({
                    title, date, description, authorId: profile.userId, timestamp: Date.now()
                });
                setTitle(''); setDate(''); setDescription('');
            };

            const handleSubmitIdea = async (e) => {
                e.preventDefault();
                if (!ideaTitle || !ideaDate || !ideaDesc) return;
                await db.collection('eventIdeas').add({
                    title: ideaTitle, date: ideaDate, description: ideaDesc, 
                    authorId: profile.userId, authorName: profile.name, 
                    status: 'Pending', timestamp: Date.now()
                });
                setIdeaTitle(''); setIdeaDate(''); setIdeaDesc('');
            };

            const handleApproveIdea = async (idea) => {
                // 1. Create Event
                await db.collection('events').add({
                    title: idea.title, date: idea.date, description: `(Idea by ${idea.authorName}) ${idea.description}`, timestamp: Date.now()
                });
                // 2. Grant +1 Hour
                await db.collection('hours').add({
                    userId: idea.authorId, userName: idea.authorName, amount: 1,
                    description: `Approved Event Idea: ${idea.title}`, status: 'Approved', timestamp: Date.now()
                });
                // 3. Mark Idea Approved
                await db.collection('eventIdeas').doc(idea.id).update({ status: 'Approved' });
            };

            const handleRejectIdea = async (ideaId) => {
                await db.collection('eventIdeas').doc(ideaId).update({ status: 'Rejected' });
            };

            const handlePostRecruitment = async (e) => {
                e.preventDefault();
                if (!recruitmentEventId || !recruitmentRole || !recruitmentCapacity || !recruitmentHours) return;
                await db.collection('eventRecruitments').add({
                    eventId: recruitmentEventId,
                    roleName: recruitmentRole,
                    capacity: Number(recruitmentCapacity),
                    potentialHours: Number(recruitmentHours),
                    sector: profile.sector,
                    authorId: profile.userId,
                    applicants: [],
                    timestamp: Date.now()
                });
                setRecruitmentRole(''); setRecruitmentCapacity(''); setRecruitmentHours('');
            }

            return (
                <div className="space-y-12 animate-fade-in-up">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-[#ec8b3f] pl-4">Events & Recruitment</h1>
                    
                    {/* CALENDAR DISPLAY (List View for Events view) */}
                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-6 border-b-2 border-black pb-2">Academic Year Timeline</h2>
                        {events.length === 0 ? (
                            <p className="text-gray-500 font-mono text-sm">No upcoming events scheduled.</p>
                        ) : (
                            <div className="space-y-4 max-h-96 overflow-y-auto custom-scrollbar pr-2">
                                {events.sort((a,b) => new Date(a.date) - new Date(b.date)).map(evt => {
                                    const recruitmentsForEvent = eventRecruitments.filter(r => r.eventId === evt.id);
                                    return (
                                        <div key={evt.id} className="flex flex-col sm:flex-row gap-4 p-4 border-2 border-black bg-gray-50 dark:bg-gray-700 items-start sm:items-center">
                                            <div className="bg-[#433f92] text-white p-3 font-black text-center min-w-[100px] shrink-0">
                                                <div className="text-2xl">{new Date(evt.date).getDate()}</div>
                                                <div className="text-xs uppercase">{new Date(evt.date).toLocaleString('default', { month: 'short', year: 'numeric' })}</div>
                                            </div>
                                            <div className="flex-1">
                                                <h3 className="font-black text-lg uppercase">{evt.title}</h3>
                                                <p className="text-sm font-mono text-gray-600 dark:text-gray-300 mb-2">{evt.description}</p>
                                                {recruitmentsForEvent.length > 0 && (
                                                    <div className="flex gap-2 flex-wrap mt-2 pt-2 border-t-2 border-dashed border-gray-300 dark:border-gray-500">
                                                        {recruitmentsForEvent.map(r => (
                                                            <span key={r.id} className="text-[10px] font-bold uppercase tracking-widest bg-gray-200 dark:bg-gray-600 px-2 py-1">
                                                                {r.roleName} ({r.applicants ? r.applicants.length : 0}/{r.capacity})
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        {/* MEMBER: SUBMIT IDEA */}
                        <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-[#433f92] p-6 shadow-[8px_8px_0px_0px_#433f92]">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-2 text-[#433f92] dark:text-[#a09df0]">Pitch an Event Idea</h2>
                            <p className="text-xs font-bold text-gray-500 mb-6 uppercase">Approved ideas grant +1 Volunteer Hour</p>
                            <form onSubmit={handleSubmitIdea} className="space-y-4">
                                <div>
                                    <label className="block text-xs uppercase font-black mb-1">Event Title</label>
                                    <input required type="text" value={ideaTitle} onChange={e=>setIdeaTitle(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800" />
                                </div>
                                <div>
                                    <label className="block text-xs uppercase font-black mb-1">Proposed Date</label>
                                    <input required type="date" value={ideaDate} onChange={e=>setIdeaDate(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                </div>
                                <div>
                                    <label className="block text-xs uppercase font-black mb-1">Resources & Goal</label>
                                    <textarea required value={ideaDesc} onChange={e=>setIdeaDesc(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 h-24 font-mono text-sm" placeholder="Who is it for? What is needed?"></textarea>
                                </div>
                                <button type="submit" className="w-full bg-[#433f92] hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors">Submit Pitch</button>
                            </form>

                        {/* PRESIDENT: ADD EVENT DIRECTLY */}
                        {isPresident && (
