                                    </form>
                                )}

                                <div className="space-y-6 max-h-[600px] overflow-y-auto custom-scrollbar pr-2">
                                    {news.map(n => (
                                        <div key={n.id} className="border-4 border-black bg-white dark:bg-gray-800 p-5 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)]">
                                            <div className="flex items-center gap-3 mb-4 border-b-2 border-dashed border-gray-300 pb-3">
                                                <div className="w-10 h-10 bg-black text-white flex items-center justify-center font-black uppercase text-lg border-2 border-black shrink-0">
                                                    {n.authorName.charAt(0)}
                                                </div>
                                                <div>
                                                    <p className="font-black uppercase tracking-widest">{n.authorName}</p>
                                                    <p className="text-[10px] font-mono text-gray-500">{new Date(n.timestamp).toLocaleString()}</p>
                                                </div>
                                            </div>
                                            <p className="font-mono text-sm leading-relaxed whitespace-pre-wrap">{n.text}</p>
                                            {n.imageUrl && (
                                                <img src={n.imageUrl} alt="News Image" className="mt-4 w-full h-auto border-4 border-black object-cover max-h-96" />
                                            )}
                                        </div>
                                    ))}
                                    {news.length === 0 && <p className="text-gray-500 font-mono text-sm">No announcements posted yet.</p>}
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)] h-full max-h-[500px]">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-4 border-b-2 border-black pb-2">Top Volunteers</h2>
                            <div className="space-y-2">
                                {leaderboard.map((u, i) => (
                                    <div key={i} className="flex justify-between items-center p-3 bg-gray-50 dark:bg-gray-700 border-2 border-transparent hover:border-[#ec8b3f] transition-colors">
                                        <span className="font-bold">{i+1}. {u.name}</span>
                                        <span className="font-black text-[#433f92] dark:text-[#a09df0]">{u.total} hrs</span>
                                    </div>
                                ))}
                                {leaderboard.length === 0 && <p className="text-gray-500 font-mono text-sm">No approved hours yet.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- EVENTS & TIMELINE VIEW ---
        function EventsView({ events, eventIdeas, profile, isPresident, isHead, eventRecruitments }) {
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [description, setDescription] = useState('');
            
            const [ideaTitle, setIdeaTitle] = useState('');
            const [ideaDate, setIdeaDate] = useState('');
            const [ideaDesc, setIdeaDesc] = useState('');

            const [recruitmentEventId, setRecruitmentEventId] = useState('');
            const [recruitmentRole, setRecruitmentRole] = useState('');
            const [recruitmentCapacity, setRecruitmentCapacity] = useState('');
            const [recruitmentHours, setRecruitmentHours] = useState('');

            // Edit Event State
            const [editEventId, setEditEventId] = useState(null);
            const [editEventForm, setEditEventForm] = useState({ title: '', date: '', description: '' });

            const handleCreateEvent = async (e) => {
                e.preventDefault();
                if (!title || !date) return;
                await db.collection('events').add({
                    title, date, description, authorId: profile.userId, timestamp: Date.now()
                });
                setTitle(''); setDate(''); setDescription('');
            };

            const handleDeleteEvent = async (id) => {
                if (window.confirm("Are you sure you want to delete this event? This action cannot be undone.")) {
                    await db.collection('events').doc(id).delete();
                }
            };

            const startEditEvent = (evt) => {
                setEditEventId(evt.id);
                setEditEventForm({ title: evt.title, date: evt.date, description: evt.description });
            };

            const saveEditEvent = async (id) => {
                await db.collection('events').doc(id).update({
                    title: editEventForm.title,
                    date: editEventForm.date,
                    description: editEventForm.description
                });
                setEditEventId(null);
            };

            const handleSubmitIdea = async (e) => {
                e.preventDefault();
                if (!ideaTitle || !ideaDate || !ideaDesc) return;
                await db.collection('eventIdeas').add({
                    title: ideaTitle, date: ideaDate, description: ideaDesc, 
                    authorId: profile.userId, authorName: profile.name, 
                    status: 'Pending', timestamp: Date.now()
                });
                setIdeaTitle(''); setIdeaDate(''); setIdeaDesc('');
            };

            const handleApproveIdea = async (idea) => {
                await db.collection('events').add({
                    title: idea.title, date: idea.date, description: `(Idea by ${idea.authorName}) ${idea.description}`, timestamp: Date.now()
                });
                await db.collection('hours').add({
                    userId: idea.authorId, userName: idea.authorName, amount: 1,
                    description: `Approved Event Idea: ${idea.title}`, status: 'Approved', timestamp: Date.now()
                });
                await db.collection('eventIdeas').doc(idea.id).update({ status: 'Approved' });
            };

            const handleRejectIdea = async (ideaId) => {
                await db.collection('eventIdeas').doc(ideaId).update({ status: 'Rejected' });
            };

            const handlePostRecruitment = async (e) => {
                e.preventDefault();
                if (!recruitmentEventId || !recruitmentRole || !recruitmentCapacity || !recruitmentHours) return;
                await db.collection('eventRecruitments').add({
                    eventId: recruitmentEventId,
                    roleName: recruitmentRole,
                    capacity: Number(recruitmentCapacity),
                    potentialHours: Number(recruitmentHours),
                    sector: profile.sector,
                    authorId: profile.userId,
                    applicants: [],
                    timestamp: Date.now()
                });
                setRecruitmentRole(''); setRecruitmentCapacity(''); setRecruitmentHours('');
            }

            return (
                <div className="space-y-12 animate-fade-in-up">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-[#ec8b3f] pl-4">Events & Recruitment</h1>
                    
                    {/* CALENDAR DISPLAY */}
                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-6 border-b-2 border-black pb-2">Academic Year Timeline</h2>
                        {events.length === 0 ? (
                            <p className="text-gray-500 font-mono text-sm">No upcoming events scheduled.</p>
                        ) : (
                            <div className="space-y-4 max-h-[500px] overflow-y-auto custom-scrollbar pr-2">
                                {events.sort((a,b) => new Date(a.date) - new Date(b.date)).map(evt => {
                                    const recruitmentsForEvent = eventRecruitments.filter(r => r.eventId === evt.id);
                                    
                                    if (editEventId === evt.id) {
                                        return (
                                            <div key={evt.id} className="p-4 border-4 border-[#ec8b3f] bg-white dark:bg-gray-800">
                                                <input value={editEventForm.title} onChange={e=>setEditEventForm({...editEventForm, title: e.target.value})} className="w-full border-2 border-black p-2 mb-2 outline-none dark:bg-gray-700 font-black uppercase" placeholder="Event Title"/>
                                                <input type="date" value={editEventForm.date} onChange={e=>setEditEventForm({...editEventForm, date: e.target.value})} className="w-full border-2 border-black p-2 mb-2 outline-none dark:bg-gray-700 font-mono"/>
                                                <textarea value={editEventForm.description} onChange={e=>setEditEventForm({...editEventForm, description: e.target.value})} className="w-full border-2 border-black p-2 mb-2 outline-none dark:bg-gray-700 font-mono text-sm h-20" placeholder="Description"></textarea>
                                                <div className="flex gap-2">
                                                    <button onClick={() => saveEditEvent(evt.id)} className="flex-1 bg-green-500 text-white font-black uppercase p-2 border-2 border-black hover:bg-black">Save Changes</button>
                                                    <button onClick={() => setEditEventId(null)} className="flex-1 bg-gray-300 text-black font-black uppercase p-2 border-2 border-black hover:bg-gray-400">Cancel</button>
                                                </div>
                                            </div>
                                        );
                                    }

                                    return (
                                        <div key={evt.id} className="flex flex-col sm:flex-row gap-4 p-4 border-2 border-black bg-gray-50 dark:bg-gray-700 items-start sm:items-center relative">
                                            {isPresident && (
                                                <div className="absolute top-2 right-2 flex gap-2">
                                                    <button onClick={() => startEditEvent(evt)} className="p-1 hover:text-blue-500 bg-white dark:bg-gray-800 border-2 border-black"><Edit3 size={16}/></button>
                                                    <button onClick={() => handleDeleteEvent(evt.id)} className="p-1 hover:text-red-500 bg-white dark:bg-gray-800 border-2 border-black"><Trash2 size={16}/></button>
                                                </div>
                                            )}
                                            <div className="bg-[#433f92] text-white p-3 font-black text-center min-w-[100px] shrink-0">
                                                <div className="text-2xl">{new Date(evt.date).getDate()}</div>
                                                <div className="text-xs uppercase">{new Date(evt.date).toLocaleString('default', { month: 'short', year: 'numeric' })}</div>
                                            </div>
                                            <div className="flex-1 pr-16">
                                                <h3 className="font-black text-lg uppercase">{evt.title}</h3>
                                                <p className="text-sm font-mono text-gray-600 dark:text-gray-300 mb-2">{evt.description}</p>
                                                {recruitmentsForEvent.length > 0 && (
                                                    <div className="flex gap-2 flex-wrap mt-2 pt-2 border-t-2 border-dashed border-gray-300 dark:border-gray-500">
                                                        {recruitmentsForEvent.map(r => (
                                                            <span key={r.id} className="text-[10px] font-bold uppercase tracking-widest bg-gray-200 dark:bg-gray-600 px-2 py-1">
                                                                {r.roleName} ({r.applicants ? r.applicants.length : 0}/{r.capacity})
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        {/* MEMBER/HEADS: SUBMIT IDEA (HIDDEN FOR PRESIDENT) */}
                        {!isPresident && (
                            <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-[#433f92] p-6 shadow-[8px_8px_0px_0px_#433f92]">
                                <h2 className="text-xl font-black uppercase tracking-widest mb-2 text-[#433f92] dark:text-[#a09df0]">Pitch an Event Idea</h2>
                                <p className="text-xs font-bold text-gray-500 mb-6 uppercase">Approved ideas grant +1 Volunteer Hour</p>
                                <form onSubmit={handleSubmitIdea} className="space-y-4">
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Event Title</label>
                                        <input required type="text" value={ideaTitle} onChange={e=>setIdeaTitle(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Proposed Date</label>
                                        <input required type="date" value={ideaDate} onChange={e=>setIdeaDate(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Resources & Goal</label>
                                        <textarea required value={ideaDesc} onChange={e=>setIdeaDesc(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 h-24 font-mono text-sm" placeholder="Who is it for? What is needed?"></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-[#433f92] hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Submit Pitch</button>
                                </form>
                            </div>
                        )}

                        {/* PRESIDENT: ADD EVENT DIRECTLY */}
                        {isPresident && (
                            <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-[#ec8b3f] p-6 shadow-[8px_8px_0px_0px_#ec8b3f]">
                                <h2 className="text-xl font-black uppercase tracking-widest mb-6 text-[#ec8b3f]">Publish Official Event</h2>
                                <form onSubmit={handleCreateEvent} className="space-y-4">
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Event Title</label>
                                        <input required type="text" value={title} onChange={e=>setTitle(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Date</label>
                                        <input required type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Description</label>
                                        <textarea value={description} onChange={e=>setDescription(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 h-24 font-mono text-sm"></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-[#ec8b3f] hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Add to Calendar</button>
                                </form>
                            </div>
                        )}
                        
                        {/* HEADS: POST RECRUITMENT */}
                        {isHead && !isPresident && (
                            <div className="bg-emerald-50 dark:bg-emerald-900/20 border-4 border-emerald-500 p-6 shadow-[8px_8px_0px_0px_#10b981]">
                                <h2 className="text-xl font-black uppercase tracking-widest mb-6 text-emerald-700 dark:text-emerald-500">Post Recruitment Role</h2>
                                <form onSubmit={handlePostRecruitment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Select Event</label>
                                        <select required value={recruitmentEventId} onChange={e=>setRecruitmentEventId(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-bold uppercase text-sm cursor-pointer">
                                            <option value="">Choose Event...</option>
                                            {events.map(ev => <option key={ev.id} value={ev.id}>{ev.title}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Role Title</label>
                                        <input required type="text" placeholder="e.g., Photographer" value={recruitmentRole} onChange={e=>setRecruitmentRole(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800" />
                                    </div>
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black mb-1">Capacity</label>
                                            <input required type="number" min="1" value={recruitmentCapacity} onChange={e=>setRecruitmentCapacity(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black mb-1">Hr Potential</label>
                                            <input required type="number" min="0.5" step="0.5" value={recruitmentHours} onChange={e=>setRecruitmentHours(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-500 hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Post Role</button>
                                </form>
                            </div>
                        )}
                    </div>

                    {/* PRESIDENT: REVIEW IDEAS */}
                    {isPresident && (
                        <div className="bg-white dark:bg-gray-800 border-4 border-black p-6">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-6 border-b-2 border-black pb-2">Review Event Pitches</h2>
                            <div className="space-y-4">
                                {eventIdeas.filter(i => i.status === 'Pending').map(idea => (
                                    <div key={idea.id} className="border-2 border-black p-4 bg-blue-50 dark:bg-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h3 className="font-black uppercase">{idea.title}</h3>
                                            <p className="text-xs font-bold text-gray-500 uppercase">By {idea.authorName} | For {idea.date}</p>
                                            <p className="text-sm font-mono mt-2">{idea.description}</p>
                                        </div>
                                        <div className="flex gap-2 w-full md:w-auto">
                                            <button onClick={() => handleApproveIdea(idea)} className="flex-1 md:flex-none bg-green-500 hover:bg-green-600 text-white px-4 py-2 font-black uppercase text-xs border-2 border-transparent">Approve (+1 Hr)</button>
                                            <button onClick={() => handleRejectIdea(idea.id)} className="flex-1 md:flex-none bg-red-500 hover:bg-red-600 text-white px-4 py-2 font-black uppercase text-xs border-2 border-transparent">Reject</button>
                                        </div>
                                    </div>
                                ))}
                                {eventIdeas.filter(i => i.status === 'Pending').length === 0 && <p className="text-gray-500 font-mono text-sm">No pending pitches.</p>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        // --- REMINDERS VIEW ---
        function RemindersView({ reminders, profile }) {
            const [text, setText] = useState('');
            const [date, setDate] = useState('');

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!text || !date) return;
                await db.collection('reminders').add({
                    userId: profile.userId, text, date, timestamp: Date.now()
                });
                setText(''); setDate('');
            };

            const handleDelete = async (id) => {
                await db.collection('reminders').doc(id).delete();
            };

            return (
                <div className="space-y-8 animate-fade-in-up max-w-4xl mx-auto">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-emerald-500 pl-4">Personal Reminders</h1>
                    <div className="bg-emerald-50 dark:bg-emerald-900/20 border-4 border-emerald-500 p-6 shadow-[8px_8px_0px_0px_#10b981]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-4 text-emerald-700 dark:text-emerald-500">Add Private Reminder</h2>
                        <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-4">
                            <input type="text" required placeholder="What do you need to do?" value={text} onChange={e=>setText(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-800 p-3 outline-none font-bold flex-1" />
                            <input type="date" required value={date} onChange={e=>setDate(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-800 p-3 outline-none font-mono font-bold w-full sm:w-1/3" />
                            <button type="submit" className="bg-emerald-500 hover:bg-black text-white px-8 py-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Add</button>
                        </form>
                    </div>
                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-4">My Schedule</h2>
                        <div className="space-y-2">
                            {reminders.sort((a,b) => new Date(a.date) - new Date(b.date)).map(rm => (
                                <div key={rm.id} className="flex justify-between items-center p-3 border-b-2 border-gray-200 dark:border-gray-700">
                                    <div>
                                        <span className="font-bold block">{rm.text}</span>
                                        <span className="font-mono text-xs text-gray-500">{new Date(rm.date).toLocaleDateString()}</span>
                                    </div>
                                    <button onClick={() => handleDelete(rm.id)} className="p-2 text-gray-400 hover:text-red-500 transition-colors"><Trash2 size={18}/></button>
                                </div>
                            ))}
                            {reminders.length === 0 && <p className="text-gray-500 text-sm font-mono">No reminders set.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        // --- HOURS VIEW (Non-presidents only) ---
        function HoursView({ hours, profile, profiles }) {
            const pendingHours = hours.filter(h => h.status === 'Pending' && h.userId === profile.userId);
            const myHours = hours.filter(h => h.userId === profile.userId);

            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!amount || !desc) return;
                await db.collection('hours').add({
                    userId: profile.userId,
                    userName: profile.name,
                    amount: Number(amount),
                    description: desc,
                    status: 'Pending',
                    timestamp: Date.now()
                });
                setAmount(''); setDesc('');
            };

            return (
                <div className="space-y-8 animate-fade-in-up">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-[#ec8b3f] pl-4">Time Tracking</h1>

                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-4">Log Hours</h2>
                        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-4">
                            <input type="number" required min="0.5" step="0.5" placeholder="Hours" value={amount} onChange={e=>setAmount(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-mono font-bold w-full sm:w-1/4" />
                            <input type="text" required placeholder="Description (e.g., Park Cleanup)" value={desc} onChange={e=>setDesc(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-bold flex-1" />
                            <button type="submit" className="bg-[#433f92] hover:bg-black text-white px-8 py-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Submit</button>
                        </form>
                    </div>

                    {pendingHours.length > 0 && (
                        <div className="bg-amber-50 dark:bg-amber-900/20 border-4 border-amber-500 p-6">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-4 text-amber-700 dark:text-amber-500">Your Pending Approvals</h2>
                            <div className="space-y-3">
                                {pendingHours.map(h => (
                                    <div key={h.id} className="flex justify-between items-center bg-white dark:bg-gray-800 p-4 border-2 border-amber-500">
                                        <div>
                                            <p className="font-bold">{h.userName} - {h.amount} hrs</p>
                                            <p className="text-sm text-gray-500 font-mono">{h.description}</p>
                                        </div>
                                        <span className="text-xs font-black uppercase tracking-widest px-2 py-1 bg-amber-100 text-amber-700">Pending</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

        // --- ADMIN & SPREADSHEET VIEW ---
        function AdminView({ profiles, isPresident, reports, currentUser, eventRecruitments }) {
            const [selectedUsers, setSelectedUsers] = useState([]);
            const [lastChecked, setLastChecked] = useState(null);
            
            const [bulkSector, setBulkSector] = useState('');
            const [bulkHours, setBulkHours] = useState('');

            // Hide removed members and filter out other Presidents
            const targetProfiles = profiles.filter(p => p.status !== 'Removed' && (p.userId === currentUser.userId || p.role !== ROLES.PRESIDENT));

            const handleSendEmail = (targetEmail, subject, body) => {
                window.location.href = `mailto:${targetEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}

--
Sent by ${currentUser.name}, ${currentUser.role}
KhaSu Interact Club`;
            };

            const handleDismissReport = async (reportId) => {
                await db.collection('reports').doc(reportId).update({ status: 'Dismissed' });
            };

            // --- MASS SELECT LOGIC (Shift-Click) ---
            const handleCheck = (e, userId, index) => {
                let newSelected = [...selectedUsers];
                if (e.shiftKey && lastChecked !== null) {
                    const start = Math.min(index, lastChecked);
                    const end = Math.max(index, lastChecked);
                    const rangeIds = targetProfiles.slice(start, end + 1).map(p => p.userId);
                    rangeIds.forEach(id => { if (!newSelected.includes(id)) newSelected.push(id); });
                } else {
                    if (newSelected.includes(userId)) {
                        newSelected = newSelected.filter(id => id !== userId);
                    } else {
                        newSelected.push(userId);
                    }
                }
                setSelectedUsers(newSelected);
                setLastChecked(index);
            };

            const toggleAll = (e) => {
                if (e.target.checked) setSelectedUsers(targetProfiles.map(p => p.userId));
                else setSelectedUsers([]);
            };

            // --- BULK ACTIONS (Soft-Ban / Revoke: removes from registers & spreadsheet, preserves account) ---
            const handleBulkBan = async () => {
                if (!window.confirm(`Revoke portal access for ${selectedUsers.length} selected users? (Their account and historical logs remain safe in Firebase, but their event registrations will be freed up)`)) return;
                
                for (const uid of selectedUsers) {
                    await db.collection('profiles').doc(uid).update({ status: 'Removed' });
                    
                    const recsToUpdate = (eventRecruitments || []).filter(r => r.applicants && r.applicants.includes(uid));
                    for (const r of recsToUpdate) {
                        const newApps = r.applicants.filter(id => id !== uid);
                        await db.collection('eventRecruitments').doc(r.id).update({ applicants: newApps });
                    }
                }
                setSelectedUsers([]);
                alert("Access revoked and event spots cleared.");
            };

            const handleBulkSectorChange = async () => {
                if (!bulkSector || selectedUsers.length === 0) return;
                const promises = selectedUsers.map(id => db.collection('profiles').doc(id).update({ sector: bulkSector }));
                await Promise.all(promises);
                setSelectedUsers([]); setBulkSector('');
                alert("Sectors updated.");
            };

            const handleBulkHoursAdjust = async () => {
                if (!bulkHours || selectedUsers.length === 0) return;
                const promises = selectedUsers.map(uid => {
                    const p = profiles.find(x => x.userId === uid);
                    return db.collection('hours').add({
                        userId: uid, userName: p.name, amount: Number(bulkHours),
                        description: `Admin Adjustment by ${currentUser.name}`, status: 'Approved', timestamp: Date.now()
                    });
                });
                await Promise.all(promises);
                setSelectedUsers([]); setBulkHours('');
                alert(`Logged ${bulkHours} hrs for ${selectedUsers.length} members.`);
            };

            return (
                <div className="space-y-12 animate-fade-in-up">
                    
                    {isPresident && (
                        <div className="bg-[#f4f4f0] dark:bg-gray-900 border-2 border-red-600 p-6 shadow-[8px_8px_0px_0px_#dc2626]">
                            <h2 className="text-3xl font-black mb-6 text-red-600 uppercase tracking-tighter border-b-4 border-red-600 pb-2">Official Reports Review</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {reports.filter(r => r.status === 'Open').map(r => (
                                    <div key={r.id} className="bg-white dark:bg-gray-800 p-6 border-4 border-red-600 relative">
                                        <div className="absolute top-0 right-0">
                                            <button onClick={() => handleDismissReport(r.id)} className="text-xs font-black uppercase tracking-widest text-white bg-gray-400 hover:bg-black px-3 py-2 transition-colors">Dismiss</button>
                                        </div>
                                        <p className="text-[10px] uppercase font-black text-gray-500 mb-1 tracking-widest">Filed By: {r.reporterName}</p>
                                        <p className="font-bold mb-4">Target: <span className="text-red-600">{r.reportedUserName}</span></p>
                                        <p className="font-mono text-sm bg-gray-100 dark:bg-gray-900 p-4 border-l-4 border-red-600">{r.reason}</p>
                                    </div>
                                ))}
                                {reports.filter(r => r.status === 'Open').length === 0 && (
                                    <p className="text-gray-500 font-mono text-sm">No open reports.</p>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-gray-900 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92]">
                        <h2 className="text-3xl font-black mb-6 uppercase tracking-tighter border-b-4 border-black pb-2 flex justify-between items-end">
                            <span>Club Roster Spreadsheet</span>
                            <span className="text-sm font-mono text-gray-500">{selectedUsers.length} Selected</span>
                        </h2>

                        {/* Admin Toolbar */}
                        {isPresident && (
                            <div className="mb-6 p-4 border-4 border-[#ec8b3f] bg-orange-50 dark:bg-gray-800 flex flex-wrap gap-4 items-end">
                                <div>
                                    <label className="block text-[10px] font-black uppercase mb-1">Mass Sector Shift</label>
                                    <div className="flex gap-2">
                                        <select value={bulkSector} onChange={e=>setBulkSector(e.target.value)} className="border-2 border-black p-2 text-xs font-bold uppercase outline-none dark:bg-gray-700">
                                            <option value="">Select Sector...</option>
                                            {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        <button onClick={handleBulkSectorChange} disabled={selectedUsers.length===0} className="bg-black text-white px-4 font-black text-xs uppercase border-2 border-transparent disabled:opacity-50">Apply</button>
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-[10px] font-black uppercase mb-1">Adjust Hours (+/-)</label>
                                    <div className="flex gap-2">
                                        <input type="number" step="0.5" value={bulkHours} onChange={e=>setBulkHours(e.target.value)} className="border-2 border-black p-2 text-xs font-mono w-24 outline-none dark:bg-gray-700" placeholder="e.g. 2.5" />
                                        <button onClick={handleBulkHoursAdjust} disabled={selectedUsers.length===0} className="bg-[#433f92] text-white px-4 font-black text-xs uppercase border-2 border-transparent disabled:opacity-50">Log</button>
                                    </div>
                                </div>

                                <div className="ml-auto">
                                    <button onClick={handleBulkBan} disabled={selectedUsers.length===0} className="bg-red-600 text-white px-6 py-2 font-black text-xs uppercase tracking-widest border-2 border-transparent hover:bg-black disabled:opacity-50">
                                        Revoke Selected
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* The Spreadsheet */}
                        <div className="overflow-x-auto border-4 border-black">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-black text-white uppercase text-xs tracking-widest">
                                        {isPresident && <th className="p-3 border-r-2 border-gray-700 w-12 text-center"><input type="checkbox" onChange={toggleAll} className="accent-[#ec8b3f] w-4 h-4 cursor-pointer"/></th>}
                                        <th className="p-3 border-r-2 border-gray-700">Name</th>
                                        <th className="p-3 border-r-2 border-gray-700">Role</th>
                                        <th className="p-3 border-r-2 border-gray-700">Sector</th>
                                        <th className="p-3 border-r-2 border-gray-700">Phone & Class</th>
                                        <th className="p-3 border-r-2 border-gray-700">Status</th>
                                        <th className="p-3">Contact</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {targetProfiles.map((p, index) => {
                                        const isSelected = selectedUsers.includes(p.userId);
                                        return (
                                            <tr key={p.id} className={`border-b-2 border-gray-300 dark:border-gray-700 transition-colors ${isSelected ? 'bg-orange-100 dark:bg-orange-900/30' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                                {isPresident && (
                                                    <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-center">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={isSelected}
                                                            onChange={(e) => handleCheck(e, p.userId, index)}
                                                            className="accent-[#ec8b3f] w-4 h-4 cursor-pointer"
                                                        />
                                                    </td>
                                                )}
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 font-bold uppercase">{p.name} {p.nickname && <span className="text-gray-500 lowercase font-mono">({p.nickname})</span>}</td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-xs font-black text-[#ec8b3f] tracking-widest uppercase">{p.role}</td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-xs font-mono font-bold">{p.sector}</td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700 text-xs font-mono">
                                                    <div>📞 {p.phone || 'N/A'}</div>
                                                    <div>🏫 {p.schoolClass || 'N/A'}</div>
                                                </td>
                                                <td className="p-3 border-r-2 border-gray-300 dark:border-gray-700">
                                                    <span className="text-[10px] font-black uppercase tracking-widest px-2 py-1 bg-green-200 text-green-800">
                                                        {p.status}
                                                    </span>
                                                </td>
                                                <td className="p-3">
                                                    <button onClick={() => handleSendEmail(p.email, "KhaSu Interact Update", "")} className="text-xs font-mono text-blue-600 dark:text-blue-400 hover:underline hover:text-black">
                                                        {p.email}
                                                    </button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                            {targetProfiles.length === 0 && <p className="p-6 text-center font-mono text-sm text-gray-500">No active members found.</p>}
                        </div>
                    </div>
                </div>
            );
        }

                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white hover:text-black transition-colors"><XCircle size={32}/></button>
                        </div>

                        <div className="p-8">
                            <div className="text-center mb-8 bg-white dark:bg-gray-800 py-8 border-4 border-black">
                                <p className="text-sm font-black text-gray-500 uppercase tracking-widest mb-2">Total Reserve</p>
                                <h3 className="text-6xl font-black text-[#433f92] drop-shadow-md">₮{balance.toLocaleString()}</h3>
                            </div>

                            <form onSubmit={handleTransaction} className="flex flex-col sm:flex-row gap-0 mb-8 border-4 border-black">
                                <select value={type} onChange={e=>setType(e.target.value)} className="bg-gray-100 dark:bg-gray-800 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none text-sm font-black uppercase w-full sm:w-1/4 cursor-pointer">
                                    <option value="credit">Credit (+)</option>
                                    <option value="debit">Debit (-)</option>
                                </select>
                                <input required type="number" step="100" min="100" placeholder="Amt (₮)" value={amount} onChange={e=>setAmount(e.target.value)} className="bg-white dark:bg-gray-700 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none w-full sm:w-1/4 font-mono font-bold" />
                                <input required type="text" placeholder="Description" value={desc} onChange={e=>setDesc(e.target.value)} className="bg-white dark:bg-gray-700 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none w-full sm:w-auto flex-1 font-bold" />
                                <button type="submit" className="bg-[#ec8b3f] hover:bg-black text-white px-8 py-4 font-black uppercase tracking-widest transition-colors">
                                    Log
                                </button>
                            </form>

                            <div className="max-h-60 overflow-y-auto custom-scrollbar border-4 border-black bg-white dark:bg-gray-800">
                                {treasuryRecords.map((t, i) => (
                                    <div key={t.id} className={`flex justify-between items-center p-4 border-b-2 border-black ${i % 2 === 0 ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-900'}`}>
                                        <div>
                                            <p className="font-black text-sm uppercase dark:text-gray-200">{t.description}</p>
                                            <p className="text-[10px] text-gray-500 font-mono font-bold">By {t.authorName}</p>
                                        </div>
                                        <span className={`font-black text-xl ${t.amount < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                            {t.amount > 0 ? '+' : ''}{t.amount.toLocaleString()}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- RENDER APP ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
