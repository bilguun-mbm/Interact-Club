                                <h2 className="text-xl font-black uppercase tracking-widest mb-6 text-[#ec8b3f]">Publish Official Event</h2>
                                <form onSubmit={handleCreateEvent} className="space-y-4">
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Event Title</label>
                                        <input required type="text" value={title} onChange={e=>setTitle(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Date</label>
                                        <input required type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Description</label>
                                        <textarea value={description} onChange={e=>setDescription(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 h-24 font-mono text-sm"></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-[#ec8b3f] hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors">Add to Calendar</button>
                                </form>
                            </div>
                        )}
                        
                        {/* HEADS: POST RECRUITMENT */}
                        {isHead && !isPresident && (
                            <div className="bg-emerald-50 dark:bg-emerald-900/20 border-4 border-emerald-500 p-6 shadow-[8px_8px_0px_0px_#10b981]">
                                <h2 className="text-xl font-black uppercase tracking-widest mb-6 text-emerald-700 dark:text-emerald-500">Post Recruitment Role</h2>
                                <form onSubmit={handlePostRecruitment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Select Event</label>
                                        <select required value={recruitmentEventId} onChange={e=>setRecruitmentEventId(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-bold uppercase text-sm cursor-pointer">
                                            <option value="">Choose Event...</option>
                                            {events.map(ev => <option key={ev.id} value={ev.id}>{ev.title}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-black mb-1">Role Title</label>
                                        <input required type="text" placeholder="e.g., Photographer" value={recruitmentRole} onChange={e=>setRecruitmentRole(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800" />
                                    </div>
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black mb-1">Capacity</label>
                                            <input required type="number" min="1" value={recruitmentCapacity} onChange={e=>setRecruitmentCapacity(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs uppercase font-black mb-1">Hr Potential</label>
                                            <input required type="number" min="0.5" step="0.5" value={recruitmentHours} onChange={e=>setRecruitmentHours(e.target.value)} className="w-full border-2 border-black p-3 outline-none dark:bg-gray-800 font-mono" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-500 hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent">Post Role</button>
                                </form>
                            </div>
                        )}
                    </div>

                    {/* PRESIDENT: REVIEW IDEAS */}
                    {isPresident && (
                        <div className="bg-white dark:bg-gray-800 border-4 border-black p-6">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-6 border-b-2 border-black pb-2">Review Event Pitches</h2>
                            <div className="space-y-4">
                                {eventIdeas.filter(i => i.status === 'Pending').map(idea => (
                                    <div key={idea.id} className="border-2 border-black p-4 bg-blue-50 dark:bg-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h3 className="font-black uppercase">{idea.title}</h3>
                                            <p className="text-xs font-bold text-gray-500 uppercase">By {idea.authorName} | For {idea.date}</p>
                                            <p className="text-sm font-mono mt-2">{idea.description}</p>
                                        </div>
                                        <div className="flex gap-2 w-full md:w-auto">
                                            <button onClick={() => handleApproveIdea(idea)} className="flex-1 md:flex-none bg-green-500 hover:bg-green-600 text-white px-4 py-2 font-black uppercase text-xs">Approve (+1 Hr)</button>
                                            <button onClick={() => handleRejectIdea(idea.id)} className="flex-1 md:flex-none bg-red-500 hover:bg-red-600 text-white px-4 py-2 font-black uppercase text-xs">Reject</button>
                                        </div>
                                    </div>
                                ))}
                                {eventIdeas.filter(i => i.status === 'Pending').length === 0 && <p className="text-gray-500 font-mono text-sm">No pending pitches.</p>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- HOURS VIEW ---
        function HoursView({ hours, profile, isPresident, isHead, profiles }) {
            const pendingHours = hours.filter(h => h.status === 'Pending');
            const myHours = hours.filter(h => h.userId === profile.userId);

            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!amount || !desc) return;
                await db.collection('hours').add({
                    userId: profile.userId,
                    userName: profile.name,
                    amount: Number(amount),
                    description: desc,
                    status: 'Pending',
                    timestamp: Date.now()
                });
                setAmount(''); setDesc('');
            };

            const handleApprove = async (id) => {
                await db.collection('hours').doc(id).update({ status: 'Approved' });
            };

            return (
                <div className="space-y-8 animate-fade-in-up">
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-gray-900 dark:text-white border-l-8 border-[#ec8b3f] pl-4">Time Tracking</h1>

                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-4">Log Hours</h2>
                        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-4">
                            <input type="number" required min="0.5" step="0.5" placeholder="Hours" value={amount} onChange={e=>setAmount(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-mono font-bold w-full sm:w-1/4" />
                            <input type="text" required placeholder="Description (e.g., Park Cleanup)" value={desc} onChange={e=>setDesc(e.target.value)} className="border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-bold flex-1" />
                            <button type="submit" className="bg-[#433f92] hover:bg-black text-white px-8 py-3 font-black uppercase tracking-widest transition-colors">Submit</button>
                        </form>
                    </div>

                    {(isPresident || isHead) && pendingHours.length > 0 && (
                        <div className="bg-amber-50 dark:bg-amber-900/20 border-4 border-amber-500 p-6">
                            <h2 className="text-xl font-black uppercase tracking-widest mb-4 text-amber-700 dark:text-amber-500">Pending Approvals</h2>
                            <div className="space-y-3">
                                {pendingHours.map(h => (
                                    <div key={h.id} className="flex justify-between items-center bg-white dark:bg-gray-800 p-4 border-2 border-amber-500">
                                        <div>
                                            <p className="font-bold">{h.userName} - {h.amount} hrs</p>
                                            <p className="text-sm text-gray-500">{h.description}</p>
                                        </div>
                                        <button onClick={() => handleApprove(h.id)} className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 font-black uppercase text-xs tracking-widest">Approve</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.1)]">
                        <h2 className="text-xl font-black uppercase tracking-widest mb-4">My History</h2>
                        <div className="space-y-2">
                            {myHours.map(h => (
                                <div key={h.id} className="flex justify-between items-center p-3 border-b-2 border-gray-200 dark:border-gray-700">
                                    <span className="font-bold">{h.description}</span>
                                    <div className="flex gap-4 items-center">
                                        <span className="font-mono">{h.amount} hrs</span>
                                        <span className={`text-xs font-black uppercase tracking-widest px-2 py-1 ${h.status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>{h.status}</span>
                                    </div>
                                </div>
                            ))}
                            {myHours.length === 0 && <p className="text-gray-500 text-sm font-mono">No hours logged.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        // --- REPORTS VIEW ---
        function ReportsView({ reports, profile, profiles }) {
            const [reportedUser, setReportedUser] = useState('');
            const [reason, setReason] = useState('');
            const [success, setSuccess] = useState(false);

            const activeProfiles = profiles.filter(p => p.status !== 'Removed' && p.userId !== profile.userId);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!reportedUser || !reason) return;
                const target = profiles.find(p => p.id === reportedUser);
                if(!target) return;

                await db.collection('reports').add({
                    reportedUserId: target.id, reportedUserName: target.name, reporterId: profile.userId, reporterName: profile.name, reason, status: 'Open', timestamp: Date.now()
                });
                setReportedUser(''); setReason(''); setSuccess(true);
                setTimeout(() => setSuccess(false), 3000);
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in-up">
                    <div className="bg-[#f4f4f0] dark:bg-gray-800 p-8 border-4 border-red-600 shadow-[8px_8px_0px_0px_#dc2626]">
                        <h2 className="text-4xl font-black mb-3 flex items-center gap-3 text-red-600 uppercase tracking-tighter">
                            <Flag size={32} strokeWidth={3} /> Report Misconduct
                        </h2>
                        <p className="text-sm font-bold text-gray-900 dark:text-gray-300 mb-8 p-4 bg-red-100 dark:bg-red-900/30 border-2 border-red-300">
                            WARNING: Reports are NOT anonymous. Misuse of the reporting system may result in penalties. 
                            Reports are sent directly to the Presidents.
                        </p>

                        {success && <div className="mb-6 p-4 bg-black text-white font-black uppercase text-center border-2 border-green-500">Report submitted officially.</div>}

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-xs uppercase font-black mb-2 tracking-widest text-black dark:text-white">Member to Report</label>
                                <select required value={reportedUser} onChange={e=>setReportedUser(e.target.value)} className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-900 rounded-none p-4 outline-none focus:border-red-600 font-bold uppercase cursor-pointer">
                                    <option value="">Select Member...</option>
                                    {activeProfiles.map(p => <option key={p.id} value={p.id}>{p.name} ({p.role})</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs uppercase font-black mb-2 tracking-widest text-black dark:text-white">Detailed Reason</label>
                                <textarea required placeholder="Describe the incident objectively..." value={reason} onChange={e=>setReason(e.target.value)} className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-900 rounded-none p-4 outline-none focus:border-red-600 h-40 font-mono text-sm" />
                            </div>
                            <button type="submit" className="bg-red-600 hover:bg-black text-white px-8 py-4 border-2 border-transparent hover:border-red-600 font-black uppercase tracking-widest transition-colors w-full">
                                Submit Official Report
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- ADMIN & SPREADSHEET VIEW ---
        function AdminView({ profiles, isPresident, reports, currentUser }) {
            const handleSendEmail = (targetEmail, subject, body) => {
                window.location.href = `mailto:${targetEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}

--
Sent by ${currentUser.name}, ${currentUser.role}
KhaSu Interact Club`;
            };

            const handleRemoveMember = async (profileObj) => {
                if (profileObj.role === ROLES.PRESIDENT) return;
                if (!window.confirm(`Permanently ban ${profileObj.name}?`)) return;
                await db.collection('profiles').doc(profileObj.userId).update({ status: 'Removed' });
                handleSendEmail(profileObj.email, "KhaSu Interact Club - Membership Revoked", `Dear ${profileObj.name},

Your membership in the KhaSu Interact Club has been formally terminated. You no longer have access to the portal.`);
            };

            const handleDismissReport = async (reportId) => {
                await db.collection('reports').doc(reportId).update({ status: 'Dismissed' });
            };

            return (
                <div className="space-y-12 animate-fade-in-up">
                    
                    {isPresident && (
                        <div className="bg-[#f4f4f0] dark:bg-gray-900 border-2 border-red-600 p-6 shadow-[8px_8px_0px_0px_#dc2626]">
                            <h2 className="text-3xl font-black mb-6 text-red-600 uppercase tracking-tighter border-b-4 border-red-600 pb-2">Official Reports Review</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {reports.filter(r => r.status === 'Open').map(r => (
                                    <div key={r.id} className="bg-white dark:bg-gray-800 p-6 border-4 border-red-600 relative">
                                        <div className="absolute top-0 right-0">
                                            <button onClick={() => handleDismissReport(r.id)} className="text-xs font-black uppercase tracking-widest text-white bg-gray-400 hover:bg-black px-3 py-2 transition-colors">Dismiss</button>
                                        </div>
                                        <p className="text-[10px] uppercase font-black text-gray-500 mb-1 tracking-widest">Filed By: {r.reporterName}</p>
                                        <p className="font-bold mb-4">Target: <span className="text-red-600">{r.reportedUserName}</span></p>
                                        <p className="font-mono text-sm bg-gray-100 dark:bg-gray-900 p-4 border-l-4 border-red-600">{r.reason}</p>
                                    </div>
                                ))}
                                {reports.filter(r => r.status === 'Open').length === 0 && (
                                    <p className="text-gray-500 font-mono text-sm">No open reports.</p>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-gray-900 border-4 border-black p-6 shadow-[8px_8px_0px_0px_#433f92]">
                        <h2 className="text-3xl font-black mb-6 uppercase tracking-tighter border-b-4 border-black pb-2">Club Roster & Status</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {profiles.map(p => (
                                <div key={p.id} className={`border-4 p-4 ${p.status === 'Removed' ? 'border-red-600 bg-red-50 dark:bg-red-900/20 opacity-50' : 'border-black bg-white dark:bg-gray-800'}`}>
                                    <div className="flex items-start justify-between">
                                        <h3 className="font-black text-lg uppercase truncate">{p.name}</h3>
                                        <span className={`text-[10px] font-black uppercase tracking-widest px-2 py-1 ${p.status === 'Removed' ? 'bg-red-600 text-white' : 'bg-green-200 text-green-800'}`}>
                                            {p.status}
                                        </span>
                                    </div>
                                    <div className="mt-2">
                                        <p className="text-xs text-[#ec8b3f] font-black uppercase tracking-widest mb-2 border-b-2 border-gray-200 pb-2">{p.role}</p>
                                        <a href={`mailto:${p.email}`} className="text-[10px] text-gray-500 hover:text-[#433f92] hover:underline font-mono truncate flex items-center gap-1">
                                            <Mail size={12}/> {p.email}
                                        </a>
                                    </div>
                                    
                                    {isPresident && p.status !== 'Removed' && p.role !== ROLES.PRESIDENT && (
                                        <div className="mt-5 flex gap-2">
                                            <button onClick={() => handleRemoveMember(p)} className="flex-1 bg-red-100 text-red-700 py-2 text-xs font-black uppercase tracking-widest hover:bg-red-600 hover:text-white transition-colors border-2 border-red-600">
                                                Ban
                                            </button>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- PROFILE VIEW ---
        function ProfileView({ profile, onLogout }) {
            const [avatar, setAvatar] = useState(profile.avatar || '');
            const [hobbies, setHobbies] = useState(profile.hobbies || '');
            const [skills, setSkills] = useState(profile.skills || '');
            const [msg, setMsg] = useState('');
            
            const handleSave = async (e) => {
                e.preventDefault();
                await db.collection('profiles').doc(profile.userId).update({ avatar, hobbies, skills });
                setMsg("Profile updated successfully!");
                setTimeout(() => setMsg(''), 3000);
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in-up">
                    <div className="bg-white dark:bg-gray-800 border-4 border-black p-8 shadow-[12px_12px_0px_0px_#433f92]">
                        <h2 className="text-4xl font-black mb-6 text-black dark:text-white uppercase tracking-tighter flex items-center gap-3">
                            <User size={32} /> My Profile
                        </h2>

                        {msg && <div className="mb-6 p-4 bg-black text-white font-black uppercase text-center border-2 border-green-500">{msg}</div>}

                        <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="md:col-span-2 flex items-center gap-6 border-b-2 border-dashed border-black pb-6">
                                <div className="w-24 h-24 bg-gray-100 border-2 border-black flex items-center justify-center overflow-hidden shrink-0">
                                    {avatar ? <img src={avatar} alt="avatar" className="w-full h-full object-cover"/> : <ImageIcon size={32} className="text-gray-400" />}
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs uppercase font-black text-black dark:text-white mb-2">Avatar Image URL</label>
                                    <input type="text" value={avatar} onChange={e=>setAvatar(e.target.value)} placeholder="https://..." className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-mono text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs uppercase font-black text-black dark:text-white mb-2">Hobbies</label>
                                <textarea value={hobbies} onChange={e=>setHobbies(e.target.value)} placeholder="Photography, Debate..." className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-mono text-sm h-32" />
                            </div>

                            <div>
                                <label className="block text-xs uppercase font-black text-black dark:text-white mb-2">Skills</label>
                                <textarea value={skills} onChange={e=>setSkills(e.target.value)} placeholder="Video editing, Public speaking..." className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-700 p-3 outline-none font-mono text-sm h-32" />
                            </div>

                            <div className="md:col-span-2 mt-4 flex flex-col md:flex-row gap-4">
                                <button type="submit" className="flex-1 bg-[#ec8b3f] hover:bg-black text-white p-4 font-black uppercase tracking-widest transition-colors border-2 border-transparent">
                                    Save Profile
                                </button>
                                <button type="button" onClick={onLogout} className="bg-red-600 hover:bg-black text-white p-4 font-black uppercase tracking-widest transition-colors border-2 border-transparent flex items-center justify-center gap-2 md:w-auto w-full">
                                    <LogOut size={18} /> Log Out
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- MODALS ---
        function TreasuryModal({ onClose, profile, balance, treasuryRecords }) {
            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');
            const [type, setType] = useState('credit');

            const handleTransaction = async (e) => {
                e.preventDefault();
                if (!amount || !desc) return;
                const finalAmount = type === 'credit' ? Math.abs(Number(amount)) : -Math.abs(Number(amount));
                
                await db.collection('treasury').add({
                    amount: finalAmount, description: desc, authorId: profile.userId, authorName: profile.name, timestamp: Date.now()
                });
                setAmount(''); setDesc('');
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-black w-full max-w-2xl shadow-[15px_15px_0px_0px_#ec8b3f] animate-fade-in-up">
                        
                        <div className="p-6 bg-black text-white flex justify-between items-center border-b-4 border-black">
                            <div>
                                <h2 className="font-black text-3xl uppercase tracking-tighter">Treasury Ledger</h2>
                                <p className="text-gray-400 text-xs font-bold uppercase tracking-widest mt-1">Immutable Log</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white hover:text-black transition-colors"><XCircle size={32}/></button>
                        </div>

                        <div className="p-8">
                            <div className="text-center mb-8 bg-white dark:bg-gray-800 py-8 border-4 border-black">
                                <p className="text-sm font-black text-gray-500 uppercase tracking-widest mb-2">Total Reserve</p>
                                <h3 className="text-6xl font-black text-[#433f92] drop-shadow-md">₮{balance.toLocaleString()}</h3>
                            </div>

                            <form onSubmit={handleTransaction} className="flex flex-col sm:flex-row gap-0 mb-8 border-4 border-black">
                                <select value={type} onChange={e=>setType(e.target.value)} className="bg-gray-100 dark:bg-gray-800 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none text-sm font-black uppercase w-full sm:w-1/4 cursor-pointer">
                                    <option value="credit">Credit (+)</option>
                                    <option value="debit">Debit (-)</option>
                                </select>
                                <input required type="number" step="100" min="100" placeholder="Amt (₮)" value={amount} onChange={e=>setAmount(e.target.value)} className="bg-white dark:bg-gray-700 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none w-full sm:w-1/4 font-mono font-bold" />
                                <input required type="text" placeholder="Description" value={desc} onChange={e=>setDesc(e.target.value)} className="bg-white dark:bg-gray-700 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none w-full sm:w-auto flex-1 font-bold" />
                                <button type="submit" className="bg-[#ec8b3f] hover:bg-black text-white px-8 py-4 font-black uppercase tracking-widest transition-colors">
                                    Log
                                </button>
                            </form>

                            <div className="max-h-60 overflow-y-auto custom-scrollbar border-4 border-black bg-white dark:bg-gray-800">
                                {treasuryRecords.map((t, i) => (
                                    <div key={t.id} className={`flex justify-between items-center p-4 border-b-2 border-black ${i % 2 === 0 ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-900'}`}>
                                        <div>
                                            <p className="font-black text-sm uppercase dark:text-gray-200">{t.description}</p>
                                            <p className="text-[10px] text-gray-500 font-mono font-bold">By {t.authorName}</p>
                                        </div>
                                        <span className={`font-black text-xl ${t.amount < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                            {t.amount > 0 ? '+' : ''}{t.amount.toLocaleString()}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- RENDER APP ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
