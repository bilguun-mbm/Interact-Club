        // --- REPORTS VIEW ---
        function ReportsView({ reports, profile, profiles }) {
            const [reportedUser, setReportedUser] = useState('');
            const [reason, setReason] = useState('');
            const [success, setSuccess] = useState(false);

            const activeProfiles = profiles.filter(p => p.status !== 'Removed' && p.userId !== profile.userId);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!reportedUser || !reason) return;
                const target = profiles.find(p => p.id === reportedUser);
                if(!target) return;

                await db.collection('reports').add({
                    reportedUserId: target.id, reportedUserName: target.name, reporterId: profile.userId, reporterName: profile.name, reason, status: 'Open', timestamp: Date.now()
                });
                setReportedUser(''); setReason(''); setSuccess(true);
                setTimeout(() => setSuccess(false), 3000);
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in-up">
                    <div className="bg-[#f4f4f0] dark:bg-gray-800 p-8 border-4 border-red-600 shadow-[8px_8px_0px_0px_#dc2626]">
                        <h2 className="text-4xl font-black mb-3 flex items-center gap-3 text-red-600 uppercase tracking-tighter">
                            <Flag size={32} strokeWidth={3} /> Report Misconduct
                        </h2>
                        <p className="text-sm font-bold text-gray-900 dark:text-gray-300 mb-8 p-4 bg-red-100 dark:bg-red-900/30 border-2 border-red-300">
                            WARNING: Reports are NOT anonymous. Misuse of the reporting system may result in penalties. 
                            Reports are sent directly to the Presidents.
                        </p>

                        {success && <div className="mb-6 p-4 bg-black text-white font-black uppercase text-center border-2 border-green-500">Report submitted officially.</div>}

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-xs uppercase font-black mb-2 tracking-widest text-black dark:text-white">Member to Report</label>
                                <select required value={reportedUser} onChange={e=>setReportedUser(e.target.value)} className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-900 rounded-none p-4 outline-none focus:border-red-600 font-bold uppercase cursor-pointer">
                                    <option value="">Select Member...</option>
                                    {activeProfiles.map(p => <option key={p.id} value={p.id}>{p.name} ({p.role})</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs uppercase font-black mb-2 tracking-widest text-black dark:text-white">Detailed Reason</label>
                                <textarea required placeholder="Describe the incident objectively..." value={reason} onChange={e=>setReason(e.target.value)} className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-900 rounded-none p-4 outline-none focus:border-red-600 h-40 font-mono text-sm" />
                            </div>
                            <button type="submit" className="bg-red-600 hover:bg-black text-white px-8 py-4 border-2 border-transparent hover:border-red-600 font-black uppercase tracking-widest transition-colors w-full">
                                Submit Official Report
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- FEEDBACK MODAL ---
        function FeedbackModal({ onClose, profile }) {
            const [text, setText] = useState('');
            const [status, setStatus] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus('Sending...');
                await db.collection('feedbacks').add({
                    text, authorId: profile.userId, authorName: profile.name, email: profile.email, timestamp: Date.now()
                });
                alert('Feedback received by the dev team. Thank you!');
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-black w-full max-w-lg shadow-[15px_15px_0px_0px_#ec8b3f] animate-fade-in-up">
                        <div className="p-4 bg-black text-white flex justify-between items-center border-b-4 border-black">
                            <h2 className="font-black text-xl uppercase tracking-tighter flex items-center gap-2"><MessageSquare size={20}/> Feedback / Bug Report</h2>
                            <button onClick={onClose} className="p-1 hover:text-[#ec8b3f] transition-colors"><XCircle size={24}/></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6">
                            <p className="text-xs font-black uppercase tracking-widest text-gray-500 mb-4">Send bugs, feedback, or feature ideas straight to the admin/dev team.</p>
                            <textarea required value={text} onChange={e=>setText(e.target.value)} placeholder="Describe your thought or issue..." className="w-full border-2 border-black dark:border-gray-600 dark:bg-gray-800 p-3 outline-none font-mono text-sm h-32 mb-4"></textarea>
                            <button type="submit" disabled={!!status} className="w-full bg-[#433f92] hover:bg-black text-white p-3 font-black uppercase tracking-widest transition-colors border-2 border-transparent disabled:opacity-50">
                                {status || 'Send to Developers'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- TREASURY MODAL ---
        function TreasuryModal({ onClose, profile, balance, treasuryRecords }) {
            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');
            const [type, setType] = useState('credit');

            const handleTransaction = async (e) => {
                e.preventDefault();
                if (!amount || !desc) return;
                const finalAmount = type === 'credit' ? Math.abs(Number(amount)) : -Math.abs(Number(amount));
                
                await db.collection('treasury').add({
                    amount: finalAmount, description: desc, authorId: profile.userId, authorName: profile.name, timestamp: Date.now()
                });
                setAmount(''); setDesc('');
            };

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-[#f4f4f0] dark:bg-gray-900 border-4 border-black w-full max-w-2xl shadow-[15px_15px_0px_0px_#ec8b3f] animate-fade-in-up">
                        
                        <div className="p-6 bg-black text-white flex justify-between items-center border-b-4 border-black">
                            <div>
                                <h2 className="font-black text-3xl uppercase tracking-tighter">Treasury Ledger</h2>
                                <p className="text-gray-400 text-xs font-bold uppercase tracking-widest mt-1">Immutable Log</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white hover:text-black transition-colors"><XCircle size={32}/></button>
                        </div>

                        <div className="p-8">
                            <div className="text-center mb-8 bg-white dark:bg-gray-800 py-8 border-4 border-black">
                                <p className="text-sm font-black text-gray-500 uppercase tracking-widest mb-2">Total Reserve</p>
                                <h3 className="text-6xl font-black text-[#433f92] drop-shadow-md">₮{balance.toLocaleString()}</h3>
                            </div>

                            <form onSubmit={handleTransaction} className="flex flex-col sm:flex-row gap-0 mb-8 border-4 border-black">
                                <select value={type} onChange={e=>setType(e.target.value)} className="bg-gray-100 dark:bg-gray-800 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none text-sm font-black uppercase w-full sm:w-1/4 cursor-pointer">
                                    <option value="credit">Credit (+)</option>
                                    <option value="debit">Debit (-)</option>
                                </select>
                                <input required type="number" step="100" min="100" placeholder="Amt (₮)" value={amount} onChange={e=>setAmount(e.target.value)} className="bg-white dark:bg-gray-700 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none w-full sm:w-1/4 font-mono font-bold" />
                                <input required type="text" placeholder="Description" value={desc} onChange={e=>setDesc(e.target.value)} className="bg-white dark:bg-gray-700 border-r-2 sm:border-r-4 sm:border-b-0 border-b-2 border-black p-4 outline-none w-full sm:w-auto flex-1 font-bold" />
                                <button type="submit" className="bg-[#ec8b3f] hover:bg-black text-white px-8 py-4 font-black uppercase tracking-widest transition-colors">
                                    Log
                                </button>
                            </form>

                            <div className="max-h-60 overflow-y-auto custom-scrollbar border-4 border-black bg-white dark:bg-gray-800">
                                {treasuryRecords.map((t, i) => (
                                    <div key={t.id} className={`flex justify-between items-center p-4 border-b-2 border-black ${i % 2 === 0 ? 'bg-gray-50 dark:bg-gray-800' : 'bg-white dark:bg-gray-900'}`}>
                                        <div>
                                            <p className="font-black text-sm uppercase dark:text-gray-200">{t.description}</p>
                                            <p className="text-[10px] text-gray-500 font-mono font-bold">By {t.authorName}</p>
                                        </div>
                                        <span className={`font-black text-xl ${t.amount < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                            {t.amount > 0 ? '+' : ''}{t.amount.toLocaleString()}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- RENDER APP ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
